<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Collaburo · Admin · Workflow Steps</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   Collaburo Admin — design tokens + base
   ============================================================ */

:root {
  /* Type — set via runtime tweak */
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* Density — overridden by .density-compact */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-7: 32px;
  --s-8: 40px;
  --s-9: 56px;

  --row-pad-y: 14px;
  --row-pad-x: 16px;
  --card-pad: 20px;
  --text-base: 14px;
  --text-sm: 13px;
  --text-xs: 11.5px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 22px;

  /* Surfaces — white canvas, warm brown/orange tones */
  --ink: #2c2418;
  --ink-2: #4a3f33;
  --ink-3: #7a7067;
  --ink-4: #a49a90;
  --ink-5: #cdc5bc;
  --line: #e8e2db;
  --line-strong: #d9d1c8;
  --canvas: #ffffff;       /* white background */
  --surface: #ffffff;      /* white cards */
  --surface-2: #faf8f6;    /* sidebar / topbar — barely warm */
  --surface-3: #f2eeea;    /* hover & contrast — light tan */
  --surface-active: #fff4eb;
  --surface-active-strong: #ffe4cf;

  /* Accent — warm orange */
  --accent: #ed7a3c;
  --accent-ink: #ffffff;
  --accent-soft: #fef6f0;
  --accent-soft-line: #f5d4b8;

  /* Signal */
  --danger: #c9442d;
  --danger-soft: #fdf0ed;

  /* Radius */
  --r-1: 4px;
  --r-2: 6px;
  --r-3: 8px;
  --r-4: 10px;
  --r-5: 14px;

  /* Shadow — minimal, Linear-style */
  --sh-1: 0 1px 0 rgba(44, 36, 24, 0.05);
  --sh-2: 0 1px 3px rgba(44, 36, 24, 0.08), 0 0 0 1px rgba(44, 36, 24, 0.04);
}

.density-compact {
  --row-pad-y: 9px;
  --row-pad-x: 12px;
  --card-pad: 14px;
  --text-base: 13px;
  --text-sm: 12px;
  --text-xs: 10.5px;
  --text-md: 14px;
  --text-lg: 15px;
  --text-xl: 19px;
}

/* ---------- Reset ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  color: var(--ink);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "ss01", "cv11";
}
button { font: inherit; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }
button, input, textarea, select { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
a { color: inherit; text-decoration: none; }

/* ---------- App shell ---------- */
.app {
  display: grid;
  grid-template-columns: var(--side-w, 240px) 1fr;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  background: var(--canvas);
}
.app.side-collapsed { --side-w: 60px; }

/* ---------- Sidebar ---------- */
.side {
  background: var(--surface-2);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.side-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--line);
  min-height: 60px;
}
.side-brand-mark {
  width: 26px; height: 26px;
  border-radius: 7px;
  background: var(--accent);
  color: #fff;
  display: grid; place-items: center;
  font-weight: 700; font-size: 14px;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}
.side-brand-name {
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.side-brand-name span {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--ink-3);
  letter-spacing: 0.02em;
}
.side-toggle {
  margin-left: auto;
  appearance: none;
  border: none;
  background: transparent;
  color: var(--ink-3);
  width: 28px; height: 28px;
  border-radius: 6px;
  display: grid; place-items: center;
  cursor: pointer;
  flex-shrink: 0;
}
.side-toggle:hover { background: var(--surface-3); color: var(--ink); }

.side-section {
  padding: 16px 12px 6px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.side-collapsed .side-section { visibility: hidden; height: 8px; padding: 0; }

.side-nav { display: flex; flex-direction: column; gap: 1px; padding: 0 8px; }
.side-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  color: var(--ink-2);
  font-size: 13.5px;
  cursor: pointer;
  white-space: nowrap;
}
.side-link:hover { background: var(--surface-3); color: var(--ink); }
.side-link.active {
  background: var(--accent);
  color: #fff;
}
.side-link.active .side-link-icon { color: #fff; }
.side-link-icon {
  width: 16px; height: 16px;
  color: var(--ink-3);
  flex-shrink: 0;
}
.side-collapsed .side-link { justify-content: center; padding: 8px; }
.side-collapsed .side-link-label { display: none; }
.side-collapsed .side-link-count { display: none; }
.side-link-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--ink-4);
  font-variant-numeric: tabular-nums;
}
.side-link.active .side-link-count { color: rgba(255,255,255,0.6); }

.side-foot {
  margin-top: auto;
  padding: 12px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
}
.side-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ed7a3c, #c9562a);
  color: #fff;
  display: grid; place-items: center;
  font-weight: 600;
  font-size: 11px;
  flex-shrink: 0;
}
.side-user {
  font-size: 12.5px;
  line-height: 1.3;
  overflow: hidden;
}
.side-user b { display: block; font-weight: 600; }
.side-user span { color: var(--ink-3); font-size: 11px; }
.side-collapsed .side-user { display: none; }

/* ---------- Main ---------- */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ---------- Top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
  min-height: 60px;
}
.crumbs {
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px;
}
.crumbs .sep { color: var(--ink-5); }
.crumbs .here {
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.005em;
}
.crumbs .past { color: var(--ink-3); }

.topbar-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.draft-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 99px;
  background: var(--surface-3);
  font-size: 11.5px;
  color: var(--ink-3);
  font-weight: 500;
}
.draft-pill::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

/* ---------- Buttons ---------- */
.btn {
  appearance: none;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  padding: 7px 14px;
  border-radius: var(--r-2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: background 0.08s, border-color 0.08s;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-5); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn.dark { background: #3d3228; color: #fff; border-color: #3d3228; }
.btn.dark:hover { background: #2c2418; }
.btn.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: transparent;
}
.btn.primary:hover { filter: brightness(0.96); }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 5px; }
.btn.icon { padding: 6px; width: 28px; height: 28px; justify-content: center; }
.btn.icon.sm { padding: 4px; width: 24px; height: 24px; }
.btn.danger-ghost {
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-3);
}
.btn.danger-ghost:hover { background: var(--danger-soft); color: var(--danger); }

.kbd {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 2px 5px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-3);
}

/* ---------- Workspace ---------- */
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 320px 1fr;
  overflow: hidden;
  min-height: 0;
}
.workspace.with-preview { grid-template-columns: 280px 1fr 420px; }

/* ---------- Step list (middle column) ---------- */
.steps-col {
  border-right: 1px solid var(--line);
  background: var(--surface-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.col-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 12px;
}
.col-head h3 {
  margin: 0;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.col-head-actions { display: flex; gap: 4px; }

.steps-body {
  padding: 0 16px 20px;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.step-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-3);
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border-color 0.08s, background 0.08s;
  position: relative;
}
.step-card:hover { border-color: var(--line-strong); }
.step-card.active {
  background: var(--surface-active);
  border-color: var(--accent-soft-line);
}
.step-card.active .step-card-num { background: var(--accent); color: #fff; }

.step-drag {
  color: var(--ink-5);
  cursor: grab;
  display: grid; place-items: center;
}
.step-drag:hover { color: var(--ink-3); }
.step-card-num {
  width: 22px; height: 22px;
  border-radius: 5px;
  background: var(--surface-3);
  color: var(--ink-3);
  display: grid; place-items: center;
  font-size: 11px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.step-card-body { flex: 1; min-width: 0; }
.step-card-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.step-card-meta {
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 1px;
  letter-spacing: 0.01em;
}
.step-card-actions {
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.1s;
}
.step-card:hover .step-card-actions,
.step-card.active .step-card-actions { opacity: 1; }

.add-step {
  border: 1px dashed var(--line-strong);
  background: transparent;
  border-radius: var(--r-3);
  padding: 12px;
  text-align: center;
  color: var(--ink-3);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 4px;
}
.add-step:hover { border-color: var(--ink-4); color: var(--ink); background: var(--surface); }

/* ---------- Editor column ---------- */
.editor-col {
  overflow-y: auto;
  background: var(--canvas);
}
.editor-inner {
  max-width: 920px;
  margin: 0 auto;
  padding: 28px 32px 80px;
}
.editor-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 20px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
.editor-head h1 {
  margin: 0 0 4px;
  font-size: var(--text-xl);
  font-weight: 600;
  letter-spacing: -0.02em;
}
.editor-head p {
  margin: 0;
  color: var(--ink-3);
  font-size: 13.5px;
  max-width: 60ch;
}
.editor-head-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 99px;
  background: var(--surface-3);
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-3);
  margin-bottom: 8px;
}

.section-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 24px 0 12px;
}
.section-bar h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-bar h2 .count {
  background: var(--surface-3);
  color: var(--ink-3);
  font-size: 10.5px;
  padding: 1px 7px;
  border-radius: 99px;
  font-variant-numeric: tabular-nums;
}

/* ---------- Field card ---------- */
.field-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.field {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-3);
  overflow: hidden;
  transition: border-color 0.1s;
}
.field:hover { border-color: var(--line-strong); }
.field.open {
  border-color: var(--line-strong);
  box-shadow: var(--sh-2);
}
.field-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: var(--row-pad-y) var(--row-pad-x);
  cursor: pointer;
  user-select: none;
}
.field-grip {
  color: var(--ink-5);
  cursor: grab;
  display: grid; place-items: center;
  margin-left: -4px;
}
.field-grip:hover { color: var(--ink-3); }
.field-name {
  font-size: var(--text-base);
  font-weight: 600;
  letter-spacing: -0.005em;
  display: flex;
  align-items: center;
  gap: 4px;
}
.field-name .req { color: var(--accent); font-weight: 700; }
.field-type-pill {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.05em;
  color: var(--ink-3);
  background: var(--surface-3);
  padding: 2px 7px;
  border-radius: 4px;
  text-transform: uppercase;
}
.field-row-spacer { flex: 1; }
.field-actions {
  display: flex;
  gap: 2px;
  align-items: center;
}

.field-body {
  border-top: 1px solid var(--line);
  padding: 18px var(--row-pad-x) 4px;
  background: var(--surface-2);
}
.density-compact .field-body { padding: 12px var(--row-pad-x) 2px; }

.field-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 16px;
  margin-bottom: 14px;
}
.field-grid.one { grid-template-columns: 1fr; }
.workflow-rental-box{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-3);padding:12px;margin-bottom:14px}
.workflow-rental-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.workflow-rental-head b{font-size:13px}
.workflow-rental-head span{font-size:11px;color:var(--ink-3)}
.workflow-rental-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.workflow-rental-chip{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-2);padding:8px 9px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12px}
.workflow-rental-chip b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.workflow-rental-chip span{font-size:11px;color:var(--ink-3)}
.workflow-rental-note{font-size:11px;color:var(--ink-3);line-height:1.4;margin-top:8px}
.layout-admin-panel{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-3);padding:12px 14px;margin-bottom:14px}
.layout-admin-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.layout-admin-head h3,.layout-admin-head h4{margin:0;font-size:13px;font-weight:750;letter-spacing:-0.01em}
.layout-admin-sub{font-size:11px;color:var(--ink-3);line-height:1.35;margin-top:2px}
.layout-admin-checks{display:flex;gap:14px;align-items:center;margin:6px 0 10px;flex-wrap:wrap}
.layout-admin-checks label{font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-2)}
.layout-admin-checks input{accent-color:var(--accent);width:14px;height:14px}
.layout-req-row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;padding:7px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-2);margin-bottom:5px;min-height:38px}
.layout-req-row.editing{grid-template-columns:auto 1fr auto}
.layout-req-row .layout-req-name{font-size:12.5px;line-height:1.25;min-width:0}
.layout-req-icon{width:22px;height:22px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.layout-req-icon img{width:22px;height:22px;object-fit:contain;border-radius:3px}
.layout-add-row{margin-top:8px;padding:10px;background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r-2)}
.layout-section-title{font-size:14px;font-weight:750;border-bottom:2px solid var(--ink);padding-bottom:7px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.03em}
.layout-space-row{display:grid;grid-template-columns:1fr 150px 78px;gap:8px;align-items:center;padding:7px 9px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-2)}
.layout-space-list{display:flex;flex-direction:column;gap:5px}
.layout-area-card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-3);padding:14px;overflow:hidden;margin-bottom:14px}
.layout-area-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.layout-area-head h4{margin:0;font-size:14px;font-weight:750}
.layout-card-body{padding:12px 14px 14px;border-top:1px solid var(--line)}
.blank-layout-list{display:flex;flex-direction:column}
.blank-layout-row{display:grid;grid-template-columns:minmax(190px,1.05fr) minmax(130px,.7fr) 128px minmax(220px,1.2fr);gap:16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.blank-layout-name{font-size:13px;font-weight:750;line-height:1.25;min-width:0}
.blank-layout-venue{font-size:11.5px;color:var(--ink-3);min-width:0}
.blank-layout-status{display:flex;align-items:center;gap:8px;min-width:0;font-size:11.5px;color:var(--ink-3)}
.blank-layout-thumb{width:36px;height:36px;object-fit:contain;border-radius:4px;border:1px solid var(--line);flex-shrink:0}
@media (max-width:1100px){.blank-layout-row{grid-template-columns:minmax(160px,1fr) minmax(110px,.6fr) 118px minmax(160px,1fr);gap:10px}}
.field-flag-row {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  padding: 4px 0 14px;
}

/* ---------- Form controls ---------- */
.lbl {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.input, .select, .textarea {
  width: 100%;
  display: block;
  appearance: none;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  border-radius: var(--r-2);
  padding: 7px 10px;
  font-size: 13px;
  color: var(--ink);
  transition: border-color 0.1s, box-shadow 0.1s;
}
.input:hover, .select:hover, .textarea:hover { border-color: var(--ink-5); }
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 18%, transparent);
}
.input::placeholder, .textarea::placeholder { color: var(--ink-4); }
.select {
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%236b6760' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: 28px;
}

.chk {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  user-select: none;
  font-size: 13px;
  color: var(--ink-2);
}
.chk input {
  appearance: none;
  width: 15px; height: 15px;
  border: 1.5px solid var(--line-strong);
  border-radius: 3px;
  background: var(--surface);
  display: grid; place-items: center;
  margin: 0;
  cursor: pointer;
  flex-shrink: 0;
}
.chk input:hover { border-color: var(--ink-4); }
.chk input:checked {
  background: var(--accent);
  border-color: var(--accent);
}
.chk input:checked::after {
  content: "";
  width: 8px; height: 5px;
  border: 1.5px solid #fff;
  border-top: 0; border-right: 0;
  transform: translateY(-1px) rotate(-45deg);
}
.chk .req { color: var(--accent); }

.swt {
  position: relative;
  width: 30px; height: 18px;
  border-radius: 99px;
  background: var(--line-strong);
  cursor: pointer;
  transition: background 0.15s;
  flex-shrink: 0;
}
.swt::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  transition: left 0.15s;
}
.swt.on { background: var(--accent); }
.swt.on::after { left: 14px; }

.swt-row {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--ink-2);
  cursor: pointer;
  user-select: none;
}

/* ---------- Advanced disclosure ---------- */
.adv {
  border-top: 1px solid var(--line);
  margin: 0 calc(-1 * var(--row-pad-x));
}
.adv-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px var(--row-pad-x);
  cursor: pointer;
  user-select: none;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.adv-head:hover { background: rgba(0,0,0,0.02); }
.adv-body {
  padding: 6px var(--row-pad-x) 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* visibility rule */
.vis-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--ink-2);
  flex-wrap: wrap;
}
.vis-row .word { color: var(--ink-3); }
.vis-row .select { width: auto; min-width: 140px; padding: 5px 28px 5px 10px; }
.vis-row .input { width: 140px; padding: 5px 10px; }

/* options editor */
.opts {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.opt-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.opt-row .grip { color: var(--ink-5); cursor: grab; }
.opt-row .input { flex: 1; padding: 5px 10px; }
.opt-add {
  align-self: flex-start;
  font-size: 12px;
  color: var(--ink-3);
  background: transparent;
  border: 1px dashed var(--line-strong);
  border-radius: 5px;
  padding: 5px 10px;
  cursor: pointer;
  display: inline-flex; gap: 4px; align-items: center;
}
.opt-add:hover { color: var(--ink); border-color: var(--ink-4); }
.simple-options {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.simple-option-card {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-2);
  overflow: hidden;
}
.simple-option-row {
  display: grid;
  grid-template-columns: 1fr auto auto auto auto;
  gap: 8px;
  align-items: center;
  padding: 6px 8px;
}
.simple-option-body {
  border-top: 1px solid var(--line);
  padding: 8px 10px 10px;
  background: var(--surface-2);
}
.simple-option-price {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: flex-end;
  min-width: 220px;
}
.simple-option-price .input {
  width: 92px;
  padding: 5px 8px;
}
.simple-sub-options {
  border-left: 2px solid var(--line);
  padding: 7px 8px 8px 10px;
  margin: 0 8px 8px 8px;
  background: var(--surface-2);
  border-radius: 0 0 var(--r-2) var(--r-2);
}
.simple-sub-settings {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-2);
  padding: 8px 10px;
  display: grid;
  grid-template-columns: minmax(180px, 260px) 1fr;
  gap: 10px;
  align-items: end;
}

/* upload */
.upload {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-2);
  padding: 10px 12px;
  font-size: 12.5px;
  color: var(--ink-3);
  background: var(--surface);
}
.upload b { color: var(--ink-2); font-weight: 600; }

/* ---------- Add field button (block) ---------- */
.add-field {
  margin-top: 12px;
  width: 100%;
  border: 1px dashed var(--line-strong);
  background: transparent;
  border-radius: var(--r-3);
  padding: 14px;
  color: var(--ink-3);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.add-field:hover { background: var(--surface); color: var(--ink); border-color: var(--ink-4); }

/* ---------- Field type picker (popover) ---------- */
.type-picker {
  position: absolute;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.12);
  padding: 6px;
  z-index: 50;
  width: 360px;
  max-height: 380px;
  overflow-y: auto;
}
.type-picker-search {
  padding: 4px;
  position: sticky;
  top: -6px;
  background: var(--surface);
  margin: -6px -6px 4px;
  border-bottom: 1px solid var(--line);
}
.type-picker-group-title {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-4);
  padding: 8px 6px 5px;
}
.type-picker-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
}
.type-picker-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  text-align: left;
  background: transparent;
  border: none;
  width: 100%;
}
.type-picker-item:hover { background: var(--surface-3); }
.type-picker-item .ic {
  width: 28px; height: 28px;
  border-radius: 6px;
  display: grid; place-items: center;
  background: var(--surface-3);
  color: var(--ink-2);
  flex-shrink: 0;
}
.type-picker-item .nm { font-size: 12.5px; font-weight: 600; }
.type-picker-item .ds { font-size: 11px; color: var(--ink-3); margin-top: 1px; }

/* ---------- Empty state ---------- */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-3);
}
.empty .ill {
  width: 56px; height: 56px;
  border-radius: 14px;
  background: var(--surface-3);
  margin: 0 auto 16px;
  display: grid; place-items: center;
  color: var(--ink-4);
}
.empty h3 {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.empty p {
  margin: 0 0 16px;
  font-size: 13px;
  max-width: 36ch;
  margin-left: auto;
  margin-right: auto;
}

/* ---------- Venue editor (admin) ---------- */

.venue-card-actions{margin-left:auto;display:flex;gap:4px}

/* ---------- Preview drawer ---------- */
.preview {
  border-left: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.preview-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
}
.preview-head h4 {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 600;
}
.preview-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  background: var(--canvas);
}
.preview-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 24px;
  box-shadow: var(--sh-2);
}
.preview-progress {
  display: flex;
  gap: 4px;
  margin-bottom: 18px;
}
.preview-progress span {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--surface-3);
}
.preview-progress span.done { background: var(--accent); }
.preview-progress span.active { background: var(--ink); }
.preview-card h2 {
  margin: 0 0 4px;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.preview-card .sub {
  margin: 0 0 18px;
  font-size: 12.5px;
  color: var(--ink-3);
}
.preview-field { margin-bottom: 14px; }
.preview-field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 5px;
  color: var(--ink-2);
}
.preview-field label .req { color: var(--accent); }
.preview-field .pinput, .preview-field .ptextarea {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 12.5px;
  background: var(--surface);
  color: var(--ink);
}
.preview-field .ptextarea { min-height: 64px; resize: vertical; font-family: inherit; }
.preview-field .ptip {
  display: inline-block;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--surface-3);
  color: var(--ink-3);
  font-size: 9px;
  text-align: center;
  line-height: 13px;
  margin-left: 4px;
  vertical-align: middle;
  cursor: help;
}
.preview-foot {
  display: flex;
  justify-content: space-between;
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

/* mini room card in preview */
.proom {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 6px;
  cursor: pointer;
}
.proom.sel { border-color: var(--accent); background: var(--accent-soft); }
.proom-thumb {
  width: 40px; height: 40px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--surface-3), var(--surface-active));
  flex-shrink: 0;
}
.proom-info b { display: block; font-size: 12.5px; font-weight: 600; }
.proom-info span { font-size: 11px; color: var(--ink-3); }

/* ---------- Scrollbar ---------- */
.steps-body::-webkit-scrollbar,
.editor-col::-webkit-scrollbar,
.preview-body::-webkit-scrollbar { width: 10px; }
.steps-body::-webkit-scrollbar-thumb,
.editor-col::-webkit-scrollbar-thumb,
.preview-body::-webkit-scrollbar-thumb {
  background: var(--ink-5);
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: content-box;
}
.steps-body::-webkit-scrollbar-thumb:hover,
.editor-col::-webkit-scrollbar-thumb:hover,
.preview-body::-webkit-scrollbar-thumb:hover { background: var(--ink-4); background-clip: content-box; }

/* tooltip-ish helpers */
.hint { color: var(--ink-4); font-size: 11.5px; font-weight: 400; letter-spacing: 0; text-transform: none; }

/* ---------- Drag & drop visual cues ---------- */
.is-dragging { opacity: 0.35; transform: scale(0.98); transition: opacity 0.15s, transform 0.15s; }
.is-drop-above, .is-drop-below { position: relative; }
.is-drop-above::before, .is-drop-below::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  height: 3px;
  background: var(--accent);
  border-radius: 99px;
  z-index: 4;
  pointer-events: none;
  animation: dropLineIn 0.15s ease-out;
}
.is-drop-above::before { top: -2px; }
.is-drop-below::after  { bottom: -2px; }
/* left-edge dot */
.is-drop-above::after, .is-drop-below::before {
  content: "";
  position: absolute;
  left: -4px;
  width: 10px; height: 10px;
  background: var(--accent);
  border: 2px solid #fff;
  border-radius: 50%;
  z-index: 5;
  pointer-events: none;
  animation: dropDotIn 0.15s ease-out;
}
.is-drop-above::after  { top: -5.5px; }
.is-drop-below::before { bottom: -5.5px; }
@keyframes dropLineIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes dropDotIn  { from { transform: scale(0); } to { transform: scale(1); } }
.field-grip, .step-drag, .opt-row .grip {
  touch-action: none;
}

/* ---------- Toasts ---------- */
.toast-host {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483645;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--ink);
  color: #fff;
  padding: 10px 14px;
  border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18), 0 0 0 1px rgba(255,255,255,0.05) inset;
  font-size: 12.5px;
  min-width: 240px;
  max-width: 420px;
  animation: toast-in 0.18s ease-out;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.toast-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: oklch(0.7 0.12 145);
  flex-shrink: 0;
}
.toast-info .toast-dot { background: var(--accent); }
.toast-success .toast-dot { background: oklch(0.7 0.16 145); }
.toast-danger .toast-dot { background: oklch(0.7 0.18 22); }
.toast-body { display: flex; flex-direction: column; line-height: 1.3; flex: 1; }
.toast-body b { font-weight: 600; }
.toast-body span { color: rgba(255,255,255,0.6); font-size: 11.5px; margin-top: 1px; }
.toast .btn { background: rgba(255,255,255,0.08); color: #fff; border-color: transparent; }
.toast .btn:hover { background: rgba(255,255,255,0.16); }

/* ---------- Search input in column head ---------- */
.col-search {
  padding: 0 16px 10px;
}
.col-search-wrap {
  position: relative;
}
.col-search input {
  width: 100%;
  padding: 7px 10px 7px 30px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  font-size: 12.5px;
}
.col-search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 18%, transparent);
  outline: none;
}
.col-search .ic {
  position: absolute;
  left: 9px; top: 50%;
  transform: translateY(-50%);
  color: var(--ink-4);
  pointer-events: none;
}
.col-search-kbd {
  position: absolute;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  padding: 2px 5px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--surface-2);
}

/* ---------- Stub / coming soon view ---------- */
.stub {
  display: grid;
  place-items: center;
  height: 100%;
  background: var(--canvas);
  padding: 40px;
}
.stub-card {
  max-width: 480px;
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 40px 36px;
}
.stub-card .ill {
  width: 64px; height: 64px;
  border-radius: 16px;
  background: var(--surface-3);
  margin: 0 auto 18px;
  display: grid; place-items: center;
  color: var(--ink-3);
}
.stub-card h2 {
  margin: 0 0 6px;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.stub-card p {
  margin: 0 0 22px;
  color: var(--ink-3);
  font-size: 13.5px;
  line-height: 1.5;
}
.stub-meta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 99px;
  background: var(--surface-3);
  font-size: 11px;
  color: var(--ink-3);
  font-weight: 500;
  margin-bottom: 16px;
}
.stub-meta::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ink-4);
}

/* ============================================================
   Client preview — fullscreen overlay (the actual booking flow)
   ============================================================ */
.cp-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--canvas);
  display: flex;
  flex-direction: column;
  animation: cp-in 0.18s ease-out;
}
@keyframes cp-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.cp-bar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  min-height: 56px;
}
.cp-bar-brand {
  display: flex; align-items: center; gap: 9px;
  font-weight: 600; font-size: 14px; letter-spacing: -0.01em;
}
.cp-bar-brand-mark {
  width: 24px; height: 24px;
  border-radius: 6px;
  background: var(--ink);
  color: #fff;
  display: grid; place-items: center;
  font-weight: 700; font-size: 13px;
}
.cp-bar-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px;
  border-radius: 99px;
  background: var(--accent-soft);
  color: var(--ink-2);
  font-size: 11px;
  font-weight: 600;
  border: 1px solid var(--accent-soft-line);
}
.cp-bar-tag::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: cp-pulse 1.4s ease-in-out infinite;
}
@keyframes cp-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.cp-bar-spacer { flex: 1; }
.cp-bar-meta {
  font-size: 12px;
  color: var(--ink-3);
  display: flex; align-items: center; gap: 12px;
}

.cp-body {
  flex: 1;
  display: grid;
  grid-template-columns: 280px 1fr;
  overflow: hidden;
  min-height: 0;
}

.cp-rail {
  border-right: 1px solid var(--line);
  padding: 32px 28px;
  overflow-y: auto;
  background: var(--surface-2);
}
.cp-rail h5 {
  margin: 0 0 18px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.cp-rail-step {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 0;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-3);
  position: relative;
}
.cp-rail-step:hover { color: var(--ink); }
.cp-rail-step.done { color: var(--ink-2); }
.cp-rail-step.active { color: var(--ink); font-weight: 600; }
.cp-rail-step-dot {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--surface);
  border: 1.5px solid var(--line-strong);
  display: grid; place-items: center;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--ink-4);
  flex-shrink: 0;
  z-index: 1;
  position: relative;
}
.cp-rail-step.done .cp-rail-step-dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.cp-rail-step.active .cp-rail-step-dot { background: var(--ink); border-color: var(--ink); color: #fff; }
/* connector line */
.cp-rail-step::before {
  content: "";
  position: absolute;
  left: 11px; top: 28px;
  width: 1.5px; height: calc(100% - 12px);
  background: var(--line-strong);
  z-index: 0;
}
.cp-rail-step:last-child::before { display: none; }
.cp-rail-step.done::before { background: var(--accent); }

.cp-scroll {
  overflow-y: auto;
  padding: 56px 56px 80px;
}
.cp-form {
  max-width: 640px;
  margin: 0 auto;
}
.cp-progress {
  display: flex;
  gap: 4px;
  margin-bottom: 32px;
}
.cp-progress span {
  flex: 1; height: 4px;
  border-radius: 2px;
  background: var(--surface-3);
  transition: background 0.2s;
}
.cp-progress span.done { background: var(--accent); }
.cp-progress span.active { background: var(--ink); }

.cp-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 12px;
}
.cp-title {
  margin: 0 0 8px;
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.15;
}
.cp-sub {
  margin: 0 0 36px;
  font-size: 15px;
  color: var(--ink-3);
  max-width: 56ch;
  line-height: 1.5;
}

.cp-field { margin-bottom: 24px; }
.cp-field label.cp-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
}
.cp-field label.cp-label .req { color: var(--accent); }
.cp-field .cp-help {
  font-size: 12px;
  color: var(--ink-3);
  margin: 0 0 8px;
  line-height: 1.4;
}
.cp-input, .cp-textarea, .cp-select {
  width: 100%;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  border-radius: 8px;
  padding: 11px 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--ink);
  transition: border-color 0.1s, box-shadow 0.1s;
}
.cp-input:hover, .cp-textarea:hover, .cp-select:hover { border-color: var(--ink-5); }
.cp-input:focus, .cp-textarea:focus, .cp-select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 14%, transparent);
}
.cp-input::placeholder, .cp-textarea::placeholder { color: var(--ink-4); }
.cp-textarea { min-height: 96px; resize: vertical; }
.cp-select {
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b6760' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 14px center;
  padding-right: 36px;
  cursor: pointer;
}

.cp-toggle-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
  transition: border-color 0.1s, background 0.1s;
}
.cp-toggle-row:hover { border-color: var(--ink-5); }
.cp-toggle-row.on { border-color: var(--accent); background: var(--accent-soft); }
.cp-toggle-row .swt { margin-top: 2px; }
.cp-toggle-row b { display: block; font-size: 13.5px; font-weight: 600; }
.cp-toggle-row span.desc { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; line-height: 1.4; }

.cp-room-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.cp-room {
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  cursor: pointer;
  background: var(--surface);
  transition: border-color 0.12s, transform 0.12s;
  position: relative;
}
.cp-room:hover { border-color: var(--ink-5); transform: translateY(-1px); }
.cp-room.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 14%, transparent); }
.cp-room.sel::after {
  content: "✓";
  position: absolute;
  top: 10px; right: 12px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: grid; place-items: center;
  font-size: 13px;
  font-weight: 600;
}
.cp-room-thumb {
  height: 110px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--surface-3), color-mix(in oklch, var(--accent) 18%, var(--surface-3)));
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}
.cp-room-thumb::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(45deg, rgba(0,0,0,0.04) 0 1px, transparent 1px 14px);
}
.cp-room b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.cp-room .cap { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.cp-room .price { display: inline-block; margin-top: 8px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); background: var(--surface-3); padding: 2px 7px; border-radius: 4px; }

.cp-addon-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}
.cp-addon {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  background: var(--surface);
  cursor: pointer;
  transition: border-color 0.1s;
}
.cp-addon:hover { border-color: var(--ink-5); }
.cp-addon.sel { border-color: var(--accent); background: var(--accent-soft); }
.cp-addon-thumb {
  height: 60px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--surface-3), var(--surface-active));
  margin-bottom: 8px;
}
.cp-addon b { display: block; font-size: 12.5px; font-weight: 600; }
.cp-addon .qty {
  display: flex; align-items: center; gap: 6px;
  margin-top: 6px;
}
.cp-addon .qty button {
  width: 22px; height: 22px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  display: grid; place-items: center;
}
.cp-addon .qty span { font-size: 12px; font-variant-numeric: tabular-nums; min-width: 14px; text-align: center; }
.cp-addon .price { font-size: 11px; color: var(--ink-3); margin-top: 4px; }

.cp-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}
.cp-back {
  border: none; background: transparent; color: var(--ink-3);
  font-size: 13.5px; font-weight: 500;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 4px;
}
.cp-back:hover { color: var(--ink); }
.cp-back:disabled { opacity: 0.3; cursor: not-allowed; }
.cp-next {
  background: var(--ink);
  color: #fff;
  border: none;
  font-size: 13.5px;
  font-weight: 600;
  padding: 11px 22px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
.cp-next:hover { background: #000; }
.cp-next.primary { background: var(--accent); }
.cp-next.primary:hover { filter: brightness(0.95); }

.cp-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  display: grid; place-items: center;
  cursor: pointer;
}
.cp-close:hover { background: var(--surface-3); }

.cp-tour {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-3);
}
.cp-tour .swt { margin: 0; }

.cp-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-4);
  font-size: 13px;
  background: var(--surface-2);
  border: 1px dashed var(--line-strong);
  border-radius: 12px;
}

/* ---------- Info icon tooltip ---------- */
.info-trigger{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--surface-3);color:var(--ink-3);font-size:10px;font-weight:700;cursor:help;position:relative;vertical-align:middle;margin-left:5px;flex-shrink:0}
.info-trigger:hover{background:var(--accent);color:#fff}
.info-popup{display:none}
.gallery-popup{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:80;pointer-events:none}
.gallery-popup img{max-width:240px;max-height:180px;border-radius:var(--r-3);box-shadow:0 4px 20px rgba(0,0,0,.25);display:block}

/* ---------- Preview tooltip (hover on ℹ in preview) ---------- */
.preview-tooltip{display:none;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:400;line-height:1.5;padding:12px 16px;border-radius:var(--r-3);width:280px;z-index:90;box-shadow:0 6px 24px rgba(0,0,0,.3);white-space:normal}
.preview-tooltip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink)}
.info-trigger:hover .preview-tooltip{display:block}
.preview-tooltip-text{display:block;margin-bottom:4px}
.preview-tooltip-img{max-width:100%;max-height:160px;border-radius:6px;margin-top:8px;display:block}

/* ---------- Field description (small text below label in preview) ---------- */
.field-desc-preview{display:block;width:100%;font-size:11.5px;color:var(--ink-3,#888);font-weight:400;line-height:1.45;margin-top:2px}

/* ---------- Upload preview ---------- */
.upload-wrap{position:relative}
.upload-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
.upload-preview{margin-top:8px;position:relative;display:inline-block}
.upload-preview img{max-width:100%;max-height:120px;border-radius:var(--r-2);border:1px solid var(--line)}
.upload-preview .remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:var(--danger-soft);color:var(--danger);border-radius:50%;display:grid;place-items:center;font-size:11px;cursor:pointer;border:2px solid var(--surface)}
.upload-preview .remove:hover{background:var(--danger);color:#fff}

/* ---------- Delete confirm modal ---------- */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:200;animation:cFadeIn .12s}
@keyframes cFadeIn{from{opacity:0}to{opacity:1}}
.confirm-modal{background:var(--surface);border-radius:var(--r-4);padding:28px 32px;width:420px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.confirm-modal h3{font-size:16px;font-weight:700;margin-bottom:8px}
.confirm-modal p{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:20px}
.confirm-modal .actions{display:flex;gap:10px;justify-content:flex-end}
.confirm-modal .btn-cancel{background:var(--surface-3);color:var(--ink-2);padding:8px 20px;border-radius:var(--r-2);font-weight:600;font-size:13px}
.confirm-modal .btn-cancel:hover{background:var(--line)}
.confirm-modal .btn-danger{background:var(--danger);color:#fff;padding:8px 20px;border-radius:var(--r-2);font-weight:600;font-size:13px}
.confirm-modal .btn-danger:hover{opacity:.9}
.confirm-modal .field-name-highlight{color:var(--accent);font-weight:700}

/* ---------- Recommended fields modal ---------- */
.rec-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:150;animation:cFadeIn .12s}
.rec-modal{background:var(--surface);border-radius:var(--r-4);padding:28px 32px;width:500px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.rec-modal h3{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:2px}
.rec-modal .sub{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4);margin-bottom:16px}
.rec-toggle-all{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;margin-bottom:10px}
.rec-toggle-all:hover{text-decoration:underline}
.rec-field{border:1px solid var(--line);border-radius:var(--r-2);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
.rec-field:hover{border-color:var(--ink-4)}
.rec-field.sel{background:var(--surface-active);border-color:var(--accent-soft-line)}
.rec-field input[type=checkbox]{accent-color:var(--accent);flex-shrink:0}
.rec-new{border:2px dashed var(--line);border-radius:var(--r-2);padding:12px;text-align:center;font-size:13px;font-weight:600;color:var(--ink-4);cursor:pointer;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.rec-new:hover{border-color:var(--accent);color:var(--accent)}
.rec-actions{display:flex;gap:10px;margin-top:4px}
.rec-actions .btn-gray{background:var(--ink-3);color:#fff;padding:9px 22px;border-radius:var(--r-2);font-weight:600;font-size:13px}
.rec-actions .btn-gray:hover{background:var(--ink)}
.rec-actions .btn-accent{background:var(--accent);color:#fff;padding:9px 22px;border-radius:var(--r-2);font-weight:600;font-size:13px}
.rec-actions .btn-accent:hover{opacity:.9}

/* ---------- Picker tabs ---------- */
.picker-tabs{display:flex;gap:0;margin-bottom:10px;border-bottom:2px solid var(--line)}
.picker-tab{padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink-4);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.picker-tab:hover{color:var(--ink-2)}
.picker-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ============================================================
   CLIENT-VIEW STYLED PREVIEW (cv-* prefix)
   Mirrors Client-View.html layout: progress bar, 2-col, form fields
   ============================================================ */
.cv-overlay{position:fixed;inset:0;z-index:300;background:#fff;overflow-y:auto;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.cv-close{position:fixed;top:16px;right:16px;z-index:310;width:36px;height:36px;border-radius:50%;background:#f0f0f0;display:grid;place-items:center;border:none;cursor:pointer;transition:background .15s}
.cv-close:hover{background:#ddd}
.cv-live-tag{position:fixed;top:20px;right:64px;z-index:310;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.03em}

.cv-page{min-height:100vh;display:flex;flex-direction:column}
.cv-header{text-align:center;padding:36px 24px 0}
.cv-title{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:28px}

/* Progress bar */
.cv-progress-bar{display:flex;align-items:center;justify-content:center;gap:0;padding:0 40px;margin-bottom:8px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.cv-progress-bar::-webkit-scrollbar{display:none}
.cv-progress-step{display:flex;align-items:center;gap:0;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cv-progress-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:#999;flex-shrink:0;transition:background .2s}
.cv-progress-dot.active,.cv-progress-dot.done{background:var(--accent)}
.cv-progress-label{font-size:12px;font-weight:500;color:#6b6b6b;margin-left:7px;transition:color .2s}
.cv-progress-label.active{color:#1a1a1a;font-weight:600}
.cv-progress-label.done{color:#3a3a3a}
.cv-progress-line{width:28px;height:2px;background:#e5e5e5;margin:0 5px;flex-shrink:1;min-width:16px}
.cv-progress-line.done{background:var(--accent)}

.cv-divider{height:3px;background:linear-gradient(90deg,var(--accent),#d96a2c);margin:20px 0 0}

/* Body */
.cv-body{flex:1;max-width:1160px;width:100%;margin:0 auto;padding:40px 48px 80px;display:flex;gap:24px;align-items:flex-start}
.cv-main{flex:1;min-width:0}
.cv-cost-sidebar{width:260px;flex-shrink:0;position:sticky;top:40px;background:#fff;border:1px solid #ded7d1;border-radius:8px;padding:16px;font-size:12px;box-shadow:0 6px 18px rgba(40,31,20,.04)}
.cv-cost-title{font-size:15px;font-weight:800;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #e7e0da;color:#111}
.cv-cost-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:#2b2b2b;align-items:baseline}
.cv-cost-row.sub{font-size:12px;color:#888;padding-left:10px}
.cv-cost-row.total{font-weight:700;font-size:14px;color:#222;border-top:1px solid #e5e5e5;margin-top:8px;padding-top:12px}
.cv-cost-note{font-size:10.5px;color:#999;margin-top:10px;line-height:1.45;border-top:1px solid #f0f0f0;padding-top:9px}
.cv-cost-section-title{font-size:13px;font-weight:800;margin:6px 0 6px;color:#2b2b2b}
.cv-cost-link{background:none;border:0;color:#f26a05;font:inherit;font-weight:500;padding:0;text-align:left;cursor:pointer}
.cv-cost-link:hover{text-decoration:underline}
.cv-cost-bullet{display:flex;gap:8px;min-width:0;align-items:baseline}
.cv-cost-bullet-dot{font-weight:800;color:#333;line-height:1}
.cv-cost-amount{font-weight:500;white-space:nowrap}
.cv-cost-total-band{background:#f26a05;color:#fff;font-weight:800;margin:10px -16px 10px;padding:10px 16px}
.cv-cost-modal-backdrop{position:fixed;inset:0;background:rgba(26,20,14,.34);z-index:340;display:flex;align-items:center;justify-content:center;padding:24px}
.cv-cost-modal{width:min(640px,calc(100vw - 48px));max-height:min(680px,calc(100vh - 72px));overflow:hidden;background:#fbfaf8;border:1px solid #d8d0ca;border-radius:10px;box-shadow:0 22px 70px rgba(40,31,20,.24);display:flex;flex-direction:column}
.cv-cost-modal-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 20px;background:#f26a05;color:#fff}
.cv-cost-modal-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.01em}
.cv-cost-modal-total{font-size:12px;color:#fff;font-weight:700;margin-top:3px;opacity:.9}
.cv-cost-modal-close{display:inline-flex;align-items:center;gap:7px;background:#2b2927;color:#fff;border:0;border-radius:7px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
.cv-cost-modal-body{padding:16px 18px;overflow:auto}
.cv-cost-breakdown-card{background:#fff;border:1px solid #d8d0ca;border-radius:7px;margin-bottom:10px;overflow:hidden}
.cv-cost-breakdown-card summary{list-style:none;cursor:pointer}
.cv-cost-breakdown-card summary::-webkit-details-marker{display:none}
.cv-cost-breakdown-head{display:grid;grid-template-columns:1fr auto 20px;gap:12px;align-items:center;padding:12px 14px}
.cv-cost-breakdown-card[open] .cv-cost-breakdown-head{border-bottom:1px solid #e6ded8}
.cv-cost-breakdown-name{font-size:15px;font-weight:800;color:#17130f}
.cv-cost-breakdown-sum{font-size:15px;font-weight:800;color:#f26a05;white-space:nowrap}
.cv-cost-breakdown-caret{color:#6f665e;font-weight:800;text-align:center;transition:transform .15s}
.cv-cost-breakdown-card[open] .cv-cost-breakdown-caret{transform:rotate(180deg)}
.cv-cost-breakdown-table{padding:10px 14px 14px}
.cv-cost-breakdown-header,.cv-cost-detail-row{display:grid;grid-template-columns:minmax(0,1fr) 58px 94px;gap:14px;align-items:baseline}
.cv-cost-breakdown-header{font-size:11px;font-weight:800;color:#6f665e;border-bottom:1px solid #ddd5cf;padding-bottom:7px;margin-bottom:7px;text-transform:uppercase;letter-spacing:.04em}
.cv-cost-detail-row{padding:5px 0;font-size:12px}
.cv-cost-detail-main{font-weight:550;color:#2a2520;min-width:0}
.cv-cost-detail-meta{font-size:10.5px;color:#8a8078;margin-top:2px}
.cv-cost-detail-qty{text-align:center;color:#2a2520}
.cv-cost-detail-amount{text-align:right;font-weight:650;color:#17130f;white-space:nowrap}
.cv-cost-breakdown-footer{display:flex;justify-content:space-between;gap:18px;align-items:center;border-top:1px solid #d8d0ca;margin-top:14px;padding-top:14px;color:#f26a05;font-size:16px;font-weight:800}
.cv-fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.cv-fields-grid .cv-form-group.full-width{grid-column:1/-1}

.cv-step-title{font-size:20px;font-weight:700;margin-bottom:8px}
.cv-step-desc{font-size:13.5px;color:#6b6b6b;line-height:1.55;margin-bottom:24px}

/* Form fields */
.cv-form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.cv-label{font-size:13px;font-weight:600;position:relative;display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.cv-req{color:var(--accent)}
.cv-field-desc{display:block;width:100%;font-size:11.5px;color:#6b6b6b;font-weight:400;line-height:1.45;margin-top:2px}
.cv-input{width:100%;border:1px solid #d0d0d0;border-radius:6px;padding:10px 12px;font-size:14px;background:#fff;transition:border-color .15s;font-family:inherit}
.cv-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(237,122,60,.12)}
.cv-input::placeholder{color:#999}
.cv-select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23999' stroke-width='1.5' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;cursor:pointer}

/* Toggle row */
.cv-toggle-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;cursor:pointer;padding:10px 12px;border-radius:8px;transition:background .15s,border-color .15s;min-height:40px}
.cv-toggle-row:hover{background:#faf7f3}
.cv-toggle-row input{margin-top:2px;flex-shrink:0;accent-color:var(--accent);width:16px;height:16px}
.cv-toggle-row b{font-weight:600}
.cv-choice-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;cursor:pointer;padding:8px 10px;border-radius:8px;transition:background .15s,border-color .15s}
.cv-choice-row:hover{background:#faf7f3}
.cv-choice-row input{margin-top:2px;flex-shrink:0;accent-color:var(--accent);width:15px;height:15px}
.cv-choice-row > span,.cv-radio-option > span,.cv-toggle-row > span{flex:1;min-width:0}

/* Venue grid */
.cv-venue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cv-venue-thumb{aspect-ratio:1.2;border-radius:6px;overflow:hidden;cursor:pointer;position:relative;border:2px solid transparent;transition:border-color .15s}
.cv-venue-thumb.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(237,122,60,.2)}
.cv-venue-ph{width:100%;height:100%;background:linear-gradient(135deg,#efefef,#e0d8cf);display:grid;place-items:center;color:#999;font-size:11px;font-weight:600}
.cv-venue-name{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600;padding:6px 8px;text-align:center}

/* Rental grid */
.cv-rental-groups{grid-column:1/-1;margin-bottom:18px}
.cv-rental-groups-title{font-size:14px;font-weight:700;margin-bottom:12px}
.cv-rental-space-label{font-size:13px;font-weight:700;margin-bottom:8px}
.cv-rental-picker-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.cv-rental-pick{position:relative;border:1px solid #d4d4d4;border-radius:6px;overflow:hidden;background:#fff;cursor:pointer;text-align:center;transition:border-color .15s,box-shadow .15s}
.cv-rental-pick:hover{border-color:#999}
.cv-rental-pick.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(237,122,60,.18)}
.cv-rental-pick-check{position:absolute;top:5px;right:5px;width:15px;height:15px;accent-color:var(--accent);z-index:2}
.cv-rental-pick-thumb{height:118px;background:linear-gradient(135deg,#eef1f3,#d9d5ce);display:grid;place-items:center;overflow:hidden}
.cv-rental-pick-thumb img{width:100%;height:100%;object-fit:cover}
.cv-rental-pick-name{font-size:12px;line-height:1.25;padding:5px 6px 7px}
.cv-rental-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cv-rental-detail{border:1px solid #d9dfe5;border-radius:4px;overflow:hidden;background:#fff}
.cv-rental-detail-head{background:#f6f7f8;border-bottom:1px solid #d9dfe5;padding:7px 10px;font-size:12px;font-weight:700}
.cv-rental-detail-body{padding:8px 10px;font-size:12px;line-height:1.35}
.cv-rental-detail-desc{font-size:11px;margin:0 0 6px;color:#555;line-height:1.35}
.cv-rental-field-label{font-size:11.5px;font-weight:700;margin:4px 0 4px;line-height:1.25}
.cv-rental-option-row{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:12px;cursor:pointer;padding:6px 8px;border-radius:6px;transition:background .15s}
.cv-rental-option-row:hover{background:#faf7f3}
.cv-rental-option-row input{accent-color:var(--accent)}
.cv-rental-price{font-size:11px;color:#444;margin-left:2px}
.cv-rental-subline{border-top:1px solid #d9dfe5;margin:8px 0 6px;padding-top:7px;font-size:12px;font-weight:700}
.cv-rental-inline-select{width:auto;min-width:100px;padding:6px 28px 6px 8px;font-size:12px}
.cv-rental-detail .cv-input{padding:7px 10px;font-size:12.5px;min-height:36px}
.cv-rental-group-panel{min-width:0}
.cv-rental-group-list{display:flex;flex-direction:column;gap:6px}
.cv-rental-group-item{border:1px solid #d9dfe5;border-radius:5px;padding:7px 8px;background:#fff}
.cv-rental-group-item .cv-rental-detail-body{padding:6px 0 0}
.cv-rental-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cv-rental-card{border:1px solid #e5e5e5;border-radius:6px;padding:10px;text-align:center;cursor:pointer;transition:border-color .15s}
.cv-rental-card:hover{border-color:#999}
.cv-rental-card.sel{border-color:var(--accent);background:#fff4eb}
.cv-rental-thumb{height:60px;border-radius:4px;background:linear-gradient(135deg,#efefef,#e0d8cf);margin-bottom:6px}
.cv-rental-name{font-size:12px;font-weight:600;margin-bottom:2px}
.cv-rental-price{font-size:11px;color:#6b6b6b}
.cv-rental-qty{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:6px}
.cv-rental-qty button{width:22px;height:22px;border:1px solid #d0d0d0;border-radius:4px;display:grid;place-items:center;font-size:12px;background:#fff;cursor:pointer}
.cv-rental-qty button:hover{background:#f7f7f7}
.cv-rental-qty span{font-size:12px;min-width:16px;text-align:center;font-variant-numeric:tabular-nums}
.cv-layout-summary{display:grid;grid-template-columns:auto minmax(220px,1fr) auto;gap:18px;align-items:center;margin:8px 0 24px;padding:20px 22px;border:1px solid var(--accent-soft-line);border-radius:8px;background:var(--accent-soft)}
.cv-layout-summary-icon{width:42px;height:42px;color:var(--accent);display:grid;place-items:center}
.cv-layout-summary-kicker{font-size:13px;color:var(--ink-3);margin-bottom:4px}
.cv-layout-summary-total{font-size:16px;font-weight:750;color:var(--ink)}
.cv-layout-summary-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cv-layout-summary-chip{background:var(--accent);color:#fff;border-radius:5px;padding:9px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
@media (max-width:900px){.cv-layout-summary{grid-template-columns:auto 1fr}.cv-layout-summary-chips{grid-column:1/-1;justify-content:flex-start}}

/* Nav buttons */
.cv-nav{display:flex;gap:12px;margin-top:32px;padding-top:24px;border-top:1px solid #e5e5e5;flex-wrap:wrap}
.cv-btn-prev{border:1px solid var(--accent);color:var(--accent);background:transparent;padding:10px 28px;border-radius:6px;font-weight:600;font-size:14px;transition:background .15s;cursor:pointer}
.cv-btn-prev:hover{background:#fff4eb}
.cv-btn-next{background:var(--accent);color:#fff;padding:10px 28px;border-radius:6px;font-weight:600;font-size:14px;transition:background .15s;cursor:pointer;border:none}
.cv-btn-next:hover{background:#d96a2c}

/* Venue preview (client) */
.cv-recommend{background:#fff8f3;border:1px solid #f5d4b8;border-radius:10px;padding:16px 20px;margin-bottom:24px;display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.5}
.cv-recommend-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.cv-recommend b{font-weight:700}
.cv-recommend a{color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer}
.cv-venue-select-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:24px}
.cv-venue-select-item{cursor:pointer;text-align:center;border:2px solid transparent;border-radius:8px;transition:border-color .15s;overflow:hidden}
.cv-venue-select-item:hover{border-color:#ccc}
.cv-venue-select-item.sel,.cv-venue-select-item.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(237,122,60,.15)}
.cv-venue-select-thumb{width:100%;aspect-ratio:1.2;background:linear-gradient(135deg,#efefef,#e0d8cf);display:grid;place-items:center;overflow:hidden}
.cv-venue-select-thumb img{width:100%;height:100%;object-fit:cover}
.cv-venue-select-name{font-size:12px;font-weight:600;padding:6px 4px;display:flex;align-items:center;justify-content:center;gap:4px}
.cv-venue-select-dot{width:7px;height:7px;border-radius:50%;background:#1a7f37;flex-shrink:0}
.cv-venue-detail{border:1px solid #e5e5e5;border-radius:10px;overflow:hidden;margin-bottom:24px}
.cv-venue-detail-top{display:grid;grid-template-columns:320px 1fr;gap:0;padding:16px 16px 0 16px}
.cv-venue-detail-img{width:100%;height:100%;min-height:220px;background:linear-gradient(135deg,#efefef,#e0d8cf);overflow:hidden;border-radius:8px}
.cv-venue-detail-img img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.cv-venue-detail-info{padding:20px 24px}
.cv-venue-detail-name{font-size:20px;font-weight:700;margin-bottom:8px}
.cv-venue-detail-desc{font-size:13px;color:#555;line-height:1.6;margin-bottom:16px}
.cv-venue-detail-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cv-venue-detail-cols h5{margin:0 0 6px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.cv-venue-detail-cols ul{margin:0;padding:0 0 0 16px;font-size:12px;line-height:1.6;color:#555}
.cv-venue-gallery-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer;padding:8px 0}
.cv-subspace-card{border:1px solid #e5e5e5;border-radius:8px;margin-bottom:16px;overflow:hidden}
.cv-subspace-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-size:14px;font-weight:600}
.cv-subspace-head:hover{background:#fafafa}
.cv-subspace-body{padding:12px 16px;border-top:1px solid #e5e5e5;font-size:13px;color:#555;line-height:1.55}
.cv-subspace-opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.cv-subspace-opt{border:1px solid #e5e5e5;border-radius:6px;padding:10px;cursor:pointer;transition:border-color .15s}
.cv-subspace-opt:hover{border-color:#999}
.cv-subspace-opt.sel,.cv-subspace-opt.active{border-color:var(--accent);background:#fff4eb}
.cv-subspace-opt-name{font-weight:600;font-size:13px}
.cv-subspace-opt-price{color:var(--accent);font-weight:700;font-size:14px;margin-top:2px}
.cv-subspace-opt-desc{font-size:11.5px;color:#888;margin-top:4px;line-height:1.4;white-space:pre-line}
.cv-booking-calc{border:1px solid #e5e5e5;border-radius:10px;padding:20px;margin-bottom:16px}
.cv-booking-calc h4{margin:0 0 14px;font-size:14px;font-weight:700}
.cv-calc-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:#444}
.cv-calc-row.total{font-weight:700;font-size:15px;color:#222;border-top:1px solid #e5e5e5;margin-top:8px;padding-top:10px}
