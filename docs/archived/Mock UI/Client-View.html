          <span>📊</span>
          <span># of people: <b style={{color:"#1a1a1a"}}>{guestCount || 0}</b> {guestCount ? "(from total guest count)" : "(set total guest count in Step 2)"}</span>
        </span>
      )}
      {hasSex && sexOptions.length > 0 && (
        <label style={{display:"inline-flex",alignItems:"center",gap:8}}>
          <span style={{fontWeight:600}}>Sex{reqMark}:</span>
          <select className="form-input" value={cur.__sex || ""} onChange={(e)=>setVal("__sex", e.target.value)} style={{width:"auto",minWidth:110,padding:"6px 28px 6px 10px"}}>
            <option value="">Select…</option>
            {sexOptions.map((opt, i) => <option key={i} value={opt}>{opt}</option>)}
          </select>
        </label>
      )}
      {hasPeopleSelector && (
        <label style={{display:"inline-flex",alignItems:"center",gap:8}}>
          <span style={{fontWeight:600}}># of people{reqMark}:</span>
          <select className="form-input" value={cur.__qty_people || peopleRange.min} onChange={(e)=>setVal("__qty_people",Number(e.target.value))} style={{width:"auto",minWidth:70,padding:"6px 28px 6px 10px"}}>
            {peopleVals.map(n=><option key={n} value={n}>{n}</option>)}
          </select>
        </label>
      )}
      {hasHours && (
        <label style={{display:"inline-flex",alignItems:"center",gap:8}}>
          <span style={{fontWeight:600}}># of hours{reqMark}:</span>
          <select className="form-input" value={cur.__qty_hours || hoursRange.min} onChange={(e)=>setVal("__qty_hours",Number(e.target.value))} style={{width:"auto",minWidth:70,padding:"6px 28px 6px 10px"}}>
            {hoursVals.map(n=><option key={n} value={n}>{n}</option>)}
          </select>
        </label>
      )}
    </div>
  );
}

function DynRichTree({ items, level, displayAs, value, onChange, fieldId, depth, levelDisplays, stepType, guestCount }) {
  const items_ = (items || []).map(i => typeof i === "string" ? { label: i } : i);
  const hasChildKey = _RICH_HAS_CHILD[level];
  const childKey = _RICH_CHILD[level];
  const nextLevel = _RICH_NEXT[level];

  const isSelected = (label) => !!(value && value[label]);
  const setSelected = (label, selected) => {
    if (displayAs === "checkbox") {
      const next = { ...(value || {}) };
      if (selected) {
        if (next[label] === undefined) next[label] = {};
      } else {
        delete next[label];
      }
      onChange(next);
    } else {
      if (selected) onChange({ [label]: (value && value[label]) || {} });
      else onChange({});
    }
  };

  const renderInfoIcons = (it) => (
    <>
      {it.infoText && (
        <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:15,height:15,borderRadius:"50%",background:"#efefef",color:"#6b6b6b",fontSize:9,fontWeight:700,cursor:"help",position:"relative",marginLeft:5}} className="dyn-tip-trigger">
          i
          <span className="dyn-tooltip" style={{minWidth:160}}>
            <span style={{display:"block",fontSize:12}}>{it.infoText}</span>
          </span>
        </span>
      )}
      {it.infoImages && it.infoImages.length > 0 && (
        <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",height:15,padding:"0 4px",borderRadius:8,background:"#fff4eb",color:"#ed7a3c",fontSize:8,fontWeight:800,cursor:"pointer",position:"relative",marginLeft:4,letterSpacing:0.3}} className="dyn-tip-trigger">
          IMG
          <span className="dyn-tooltip" style={{minWidth:200}}>
            {it.infoImages.map((im, ii) => (
              <img key={ii} src={im} alt="" style={{maxWidth:"100%",maxHeight:140,borderRadius:6,display:"block",marginBottom:4}} />
            ))}
          </span>
        </span>
      )}
    </>
  );

  if (displayAs === "select") {
    const selLabel = Object.keys(value || {})[0] || "";
    const selItem = items_.find(it => it.label === selLabel);
    return (
      <div>
        <select
          className="form-input"
          value={selLabel}
          onChange={(e) => {
            const lbl = e.target.value;
            if (!lbl) onChange({});
            else onChange({ [lbl]: (value && value[lbl]) || {} });
          }}
        >
          <option value="">Select…</option>
          {items_.map((it, i) => {
            const unit = _pricingUnitFor(it.pricingStructure);
            const suffix = it.enablePrice && it.pricingStructure === "included"
              ? " (included)"
              : it.enablePrice && Number(it.price) > 0
              ? ` (+$${it.price}${unit ? " " + unit : ""})`
              : "";
            return (<option key={i} value={it.label}>{it.label}{suffix}</option>);
          })}
        </select>
        {selItem && hasChildKey && selItem[hasChildKey] && (selItem[childKey] || []).length > 0 && (
          <div style={{paddingLeft:14,marginTop:8,borderLeft:"2px solid #e5e5e5"}}>
            <DynRichTree
              items={selItem[childKey]}
              level={nextLevel}
              displayAs={(levelDisplays && levelDisplays[nextLevel]) || "checkbox"}
              value={(value && value[selLabel]) || {}}
              onChange={(nv) => onChange({ [selLabel]: nv })}
              fieldId={fieldId + "_" + selLabel.replace(/\s+/g, "_")}
              depth={depth + 1}
              levelDisplays={levelDisplays}
              guestCount={guestCount}
            />
          </div>
        )}
      </div>
    );
  }

  const isServicesStep = stepType === "services";
  return (
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {items_.map((it, i) => {
        const sel = isSelected(it.label);
        return (
          <div key={i}>
            <label style={{display:"flex",alignItems:"flex-start",gap:10,padding:"6px 0",cursor:"pointer",fontSize:13.5}}>
              <input
                type={displayAs === "checkbox" ? "checkbox" : "radio"}
                name={fieldId}
                checked={sel}
                onChange={(e) => setSelected(it.label, e.target.checked)}
                style={{marginTop:3,accentColor:"#ed7a3c"}}
              />
              <span style={{flex:1}}>
                {it.label}
                {it.enablePrice && it.pricingStructure === "included" && (
                  <span style={{color:"#888",marginLeft:8,fontSize:12,fontStyle:"italic"}}>Included in cost</span>
                )}
                {it.enablePrice && it.pricingStructure === "quote" && (
                  <span style={{color:"#6b6b6b",marginLeft:8,fontSize:12,fontStyle:"italic",border:"1px solid #e5e5e5",padding:"1px 8px",borderRadius:10}}>Quote on request</span>
                )}
                {it.enablePrice && it.pricingStructure !== "included" && it.pricingStructure !== "quote" && Number(it.price) > 0 && (
                  <span style={{color:"#ed7a3c",marginLeft:8,fontWeight:600,fontSize:13}}>
                    +${it.price}{_pricingUnitFor(it.pricingStructure) ? " " + _pricingUnitFor(it.pricingStructure) : ""}
                  </span>
                )}
                {!isServicesStep && renderInfoIcons(it)}
                {isServicesStep && it.infoImages && it.infoImages.length > 0 && (
                  <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",height:15,padding:"0 4px",borderRadius:8,background:"#fff4eb",color:"#ed7a3c",fontSize:8,fontWeight:800,cursor:"pointer",position:"relative",marginLeft:4,letterSpacing:0.3}} className="dyn-tip-trigger">
                    IMG
                    <span className="dyn-tooltip" style={{minWidth:200}}>
                      {it.infoImages.map((im, ii) => (<img key={ii} src={im} alt="" style={{maxWidth:"100%",maxHeight:140,borderRadius:6,display:"block",marginBottom:4}} />))}
                    </span>
                  </span>
                )}
              </span>
            </label>
            {isServicesStep && it.infoText && <DynInlineDescription text={it.infoText} />}
            {sel && <DynQuantityRow item={it} value={value || {}} onChange={onChange} label={it.label} guestCount={guestCount} />}
            {sel && hasChildKey && it[hasChildKey] && (it[childKey] || []).length > 0 && (
              <div style={{paddingLeft:28,marginTop:4,marginBottom:6,borderLeft:"2px solid #e5e5e5"}}>
                <DynRichTree
                  items={it[childKey]}
                  level={nextLevel}
                  displayAs={(levelDisplays && levelDisplays[nextLevel]) || "checkbox"}
                  value={(value && value[it.label]) || {}}
                  onChange={(nv) => {
                    const next = { ...(value || {}) };
                    next[it.label] = nv;
                    onChange(next);
                  }}
                  fieldId={fieldId + "_" + it.label.replace(/\s+/g, "_")}
                  depth={depth + 1}
                  levelDisplays={levelDisplays}
                  guestCount={guestCount}
                />
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function DynField({ f, value, onChange, stepType, guestCount }) {
  if (f.type === "separator") {
    return <div style={{ gridColumn: "1 / -1", borderTop: "1.5px solid #e5e5e5", margin: "12px 0" }} />;
  }
  if (f.type === "instructional") {
    return (
      <div style={{ gridColumn: "1 / -1", padding: "6px 0" }}>
        <p style={{ fontSize: 13, color: "#1a1a1a", lineHeight: 1.6, margin: 0 }}>{f.label}</p>
        {f.fieldDescription && <p style={{ fontSize: 11.5, color: "#6b6b6b", margin: "4px 0 0", lineHeight: 1.5 }}>{f.fieldDescription}</p>}
      </div>
    );
  }
  const hasTooltip = f.helpText || f.galleryImage;
  const tooltipEl = hasTooltip ? (
    <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:16,height:16,borderRadius:"50%",background:"#efefef",color:"#6b6b6b",fontSize:10,fontWeight:700,cursor:"help",position:"relative",verticalAlign:"middle",marginLeft:5,flexShrink:0}} className="dyn-tip-trigger">
      i
      <span className="dyn-tooltip">
        {f.helpText && <span style={{display:"block",marginBottom:f.galleryImage?8:0}}>{f.helpText}</span>}
        {f.galleryImage && <img src={f.galleryImage} alt="Info" style={{maxWidth:"100%",maxHeight:160,borderRadius:6,display:"block"}} />}
      </span>
    </span>
  ) : null;

  const descEl = f.fieldDescription ? (
    <span style={{display:"block",width:"100%",fontSize:"11.5px",color:"#6b6b6b",fontWeight:400,lineHeight:1.45,marginTop:2}}>{f.fieldDescription}</span>
  ) : null;

  // Compute per-field running total for rich-options fields
  const _hasRichOpts = (f.options || []).some(o => typeof o === "object");
  const fieldTotal = _hasRichOpts ? computeRichCost(f, value, guestCount).total : 0;
  const _showTotal = _hasRichOpts && (stepType === "services" || fieldTotal > 0);
  const totalChip = _showTotal ? (
    <span style={{marginLeft:"auto",color:"#ed7a3c",fontWeight:700,fontSize:13,paddingLeft:12}}>
      Total: ${fieldTotal.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
    </span>
  ) : null;
  const labelEl = (
    <label style={{fontSize:13,fontWeight:600,position:"relative",display:"flex",alignItems:"center",gap:4,flexWrap:"wrap",width:"100%"}}>
      <span style={{display:"inline-flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
        {f.label}{f.required && <span className="req"> *</span>}
        {tooltipEl}
      </span>
      {totalChip}
      {descEl}
    </label>
  );

  switch (f.type) {
    case "textarea":
      return (<div className="form-group mb">{labelEl}<textarea className="form-input" style={{minHeight:80}} placeholder={f.placeholder||""} value={value||""} onChange={e=>onChange(e.target.value)}/></div>);
    case "toggle":
      return (
        <div className="form-group mb">
          <label className="chk-row" onClick={()=>onChange(!value)} style={{cursor:"pointer"}}>
            <input type="checkbox" checked={!!value} readOnly/>
            <span><b>{f.label}{f.required&&<span className="req"> *</span>}</b>{tooltipEl}{f.fieldDescription&&<span className="chk-desc">{f.fieldDescription}</span>}</span>
          </label>
        </div>
      );
    case "select": case "multiselect": {
      const _hasRich = (f.options||[]).some(o => typeof o === "object");
      if (_hasRich) {
        const treeValue = (value && typeof value === "object" && !value.main) ? value : {};
        const _levelDisplays = {
          option: f.displayAs || (f.type === "select" ? "select" : f.type === "multiselect" ? "checkbox" : "radio"),
          subOption: f.subOptionDisplayAs || "checkbox",
          selection: f.selectionDisplayAs || "checkbox",
          specification: f.specificationDisplayAs || "checkbox",
        };
        return (
          <div className="form-group mb">
            {labelEl}
            <DynRichTree
              items={f.options || []}
              level="option"
              displayAs={_levelDisplays.option}
              value={treeValue}
              onChange={(v) => onChange(v)}
              fieldId={f.id}
              depth={0}
              levelDisplays={_levelDisplays}
              stepType={stepType}
              guestCount={guestCount}
            />
          </div>
        );
      }
      const _optLabels = (f.options||[]).map(o => typeof o === "string" ? o : o.label);
      return (<div className="form-group mb">{labelEl}<select className="form-input" value={value||""} onChange={e=>onChange(e.target.value)} style={{appearance:"none",backgroundImage:"url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23999' stroke-width='1.5' stroke-linecap='round'/></svg>\")",backgroundRepeat:"no-repeat",backgroundPosition:"right 12px center",paddingRight:32,cursor:"pointer"}}><option value="">{f.placeholder||"Select…"}</option>{_optLabels.map((o,i)=><option key={i} value={o}>{o}</option>)}</select></div>);
    }
    case "date":
      return (<div className="form-group mb">{labelEl}<input className="form-input" type="date" value={value||""} onChange={e=>onChange(e.target.value)}/></div>);
    case "daterange":
      return (<div className="form-group mb">{labelEl}<div className="form-row"><input className="form-input" type="date" value={(value&&value.start)||""} onChange={e=>onChange({...(value||{}),start:e.target.value})}/><input className="form-input" type="date" value={(value&&value.end)||""} onChange={e=>onChange({...(value||{}),end:e.target.value})}/></div></div>);
    case "radio": {
      const _hasRich = (f.options||[]).some(o => typeof o === "object");
      if (_hasRich) {
        // Rich options on radio → route through 4-level tree
        const treeValue = (value && typeof value === "object" && !value.main) ? value : {};
        const _levelDisplays = {
          option: "radio",
          subOption: f.subOptionDisplayAs || "checkbox",
          selection: f.selectionDisplayAs || "checkbox",
          specification: f.specificationDisplayAs || "checkbox",
        };
        return (
          <div className="form-group mb">
            {labelEl}
            <DynRichTree
              items={f.options || []}
              level="option"
              displayAs="radio"
              value={treeValue}
              onChange={(v) => onChange(v)}
              fieldId={f.id}
              depth={0}
              levelDisplays={_levelDisplays}
            />
          </div>
        );
      }
      const opts = (f.options || []).map(o => { const p = o.split("|"); return { label: p[0], desc: p[1] || "" }; });
      return (
        <div className="form-group mb">
          {labelEl}
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {opts.map((o,i) => (
              <label key={i} style={{display:"flex",alignItems:"flex-start",gap:10,border:"1px solid "+(value===o.label?"#ed7a3c":"#d0d0d0"),borderRadius:8,padding:"12px 14px",cursor:"pointer",background:value===o.label?"#fff4eb":"#fff",transition:"border-color .15s,background .15s"}} onClick={()=>onChange(o.label)}>
                <input type="radio" name={f.id} checked={value===o.label} readOnly style={{marginTop:3,accentColor:"#ed7a3c"}}/>
                <span>
                  <div style={{fontSize:13.5,fontWeight:600}}>{o.label}</div>
                  {o.desc && <div style={{fontSize:12,color:"#6b6b6b",marginTop:2,lineHeight:1.45}}>{o.desc}</div>}
                </span>
              </label>
            ))}
          </div>
        </div>
      );
    }
    case "groupselect": {
      const groups = []; let cur = { label: "", items: [] };
      (f.options || []).forEach(o => { if (o.startsWith("@")) { if (cur.label||cur.items.length) groups.push(cur); cur = { label: o.slice(1), items: [] }; } else { cur.items.push(o); } });
      if (cur.label||cur.items.length) groups.push(cur);
      return (
        <div className="form-group mb">
          {labelEl}
          <select className="form-input" value={value||""} onChange={e=>onChange(e.target.value)} style={{appearance:"none",backgroundImage:"url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23999' stroke-width='1.5' stroke-linecap='round'/></svg>\")",backgroundRepeat:"no-repeat",backgroundPosition:"right 12px center",paddingRight:32,cursor:"pointer"}}>
            <option value="">{f.placeholder||"Select…"}</option>
            {groups.map((g,gi) => g.label ? (<optgroup key={gi} label={g.label}>{g.items.map((it,ii)=><option key={ii} value={it}>{it}</option>)}</optgroup>) : g.items.map((it,ii)=><option key={"u"+ii} value={it}>{it}</option>))}
          </select>
        </div>
      );
    }
    case "number":
      return (<div className="form-group mb">{labelEl}<input className="form-input" type="tel" placeholder={f.placeholder||""} value={value||""} onChange={e=>onChange(e.target.value)}/>{(f.min!=null||f.max!=null)&&<span style={{fontSize:11,color:"#999",marginTop:3}}>{f.min!=null&&f.max!=null?`Between ${f.min} and ${f.max}`:f.min!=null?`Minimum: ${f.min}`:`Maximum: ${f.max}`}</span>}</div>);
    case "file":
      return (<div className="form-group mb">{labelEl}<div className="form-input" style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",color:"#999",background:"#f7f7f7",borderStyle:"dashed"}}>📎 Drop a file or click to upload</div></div>);
    case "price":
      return (<div className="form-group mb">{labelEl}<input className="form-input" placeholder={f.placeholder||"$0.00"} value={value||""} onChange={e=>onChange(e.target.value)}/></div>);
    case "room":
      return (
        <div className="form-group mb">
          {labelEl}
          <div className="venue-grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))"}}>
            {VENUES.map(v=>(
              <div key={v.id} className={"venue-thumb"+(value===v.name?" sel":"")} onClick={()=>onChange(v.name)}>
                <div className="ph">{v.name}</div>
                <div className="name">{v.name}</div>
              </div>
            ))}
          </div>
        </div>
      );
    case "time":
      return (<div className="form-group mb">{labelEl}<input className="form-input" type="time" value={value||"14:00"} onChange={e=>onChange(e.target.value)} style={{maxWidth:200}}/></div>);
    case "checkbox": {
      const _cRichOpts = (f.options||[]).map(o => typeof o === "string" ? { label: o } : o);
      const _cChecked = typeof value === "object" ? value : { on: !!value };
      const _cSet = (patch) => onChange({ ..._cChecked, ...patch });
      return (
        <div className="form-group mb">
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13.5,cursor:"pointer",fontWeight:600}} onClick={()=>_cSet({on:!_cChecked.on})}>
              <input type="checkbox" checked={!!_cChecked.on} readOnly style={{accentColor:"#ed7a3c"}}/>
              <span>{f.label}{f.required&&<span className="req"> *</span>}</span>
              {tooltipEl}
              {f.fieldDescription&&<span style={{fontWeight:400,fontSize:12,color:"#6b6b6b"}}>({f.fieldDescription})</span>}
            </label>
            {_cChecked.on && f.displayAs==="radio" && _cRichOpts.map((o,i)=>(
              <label key={i} style={{display:"flex",alignItems:"center",gap:5,fontSize:13,cursor:"pointer"}} onClick={()=>_cSet({sub:o.label})}>
                <input type="radio" name={f.id} checked={_cChecked.sub===o.label} readOnly style={{accentColor:"#ed7a3c"}}/>{o.label}
              </label>
            ))}
            {_cChecked.on && f.displayAs==="select" && (
              <select className="form-input" style={{width:"auto",minWidth:70}} value={_cChecked.sub||""} onChange={e=>_cSet({sub:e.target.value})}>
                <option value="">Select…</option>
                {_cRichOpts.map((o,i)=><option key={i} value={o.label}>{o.label}</option>)}
              </select>
            )}
          </div>
        </div>
      );
    }
    case "dietary": {
      const _dSel = value || {};
      return (
        <div className="form-group mb">
          {labelEl}
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {(f.dietaryOptions||[]).map((d,i)=>(
              <label key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,cursor:"pointer"}} onClick={()=>onChange({..._dSel,[d]:!_dSel[d]})}>
                <input type="checkbox" checked={!!_dSel[d]} readOnly style={{accentColor:"#ed7a3c"}}/>{d}
              </label>
            ))}
          </div>
        </div>
      );
    }
    default:
      return (<div className="form-group mb">{labelEl}<input className="form-input" placeholder={f.placeholder||""} value={value||""} onChange={e=>onChange(e.target.value)}/></div>);
  }
}

// Venue body for dynamic steps
function DynVenueBody({ step, answers, allSteps, onAnswer }) {
  const [selectedId, _setSelectedId] = React.useState(null);
  const setSelectedId = (id) => { _setSelectedId(id); if (onAnswer) onAnswer("_selectedVenueId", id); };
  const [subSpaceId, setSubSpaceId] = React.useState(null);
  const [startDate, setStartDate] = React.useState("");
  const [startTime, setStartTime] = React.useState("");
  const [endDate, setEndDate] = React.useState("");
  const [endTime, setEndTime] = React.useState("");
  const [showGallery, setShowGallery] = React.useState(false);
  const [galleryIdx, setGalleryIdx] = React.useState(0);
  const [subSpaceOpen, setSubSpaceOpen] = React.useState(false);
  const [dateWarning, setDateWarning] = React.useState("");

  const venues = (step.venues || []).filter(v => v.active && v.visibility !== "admin_only");
  const selected = venues.find(v => v.id === selectedId) || null;
  const fmt = n => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // Booking hours helpers
  const DAY_KEYS = ["sun","mon","tue","wed","thu","fri","sat"];
  const dayNames = {sun:"Sundays",mon:"Mondays",tue:"Tuesdays",wed:"Wednesdays",thu:"Thursdays",fri:"Fridays",sat:"Saturdays"};
  const getHoursForDate = (dateStr) => {
    if (!selected || !dateStr) return null;
    const d = new Date(dateStr + "T00:00:00");
    if (isNaN(d)) return null;
    const bh = (selected.advancedPricing || {}).bookingHours || {};
    const val = bh[DAY_KEYS[d.getDay()]];
    if (!val || val.toLowerCase() === "closed") return "closed";
    const m = val.match(/^(\d{2}:\d{2})-(\d{2}:\d{2})$/);
    return m ? { open: m[1], close: m[2] } : null;
  };
  const isDateClosed = (dateStr) => getHoursForDate(dateStr) === "closed";
  const closedDaysList = selected ? DAY_KEYS.filter(k => {
    const bh = (selected.advancedPricing || {}).bookingHours || {};
    const v = bh[k]; return v && v.toLowerCase() === "closed";
  }) : [];

  const handleStartDate = (val) => {
    if (isDateClosed(val)) {
      const d = new Date(val + "T00:00:00");
      const dayKey = DAY_KEYS[d.getDay()];
      setDateWarning("This venue is closed on " + dayNames[dayKey] + ". Please pick another date.");
      setStartDate(""); setStartTime(""); return;
    }
    setDateWarning(""); setStartDate(val);
    if (endDate && val > endDate) setEndDate(val);
  };
  const handleEndDate = (val) => {
    if (isDateClosed(val)) {
      const d = new Date(val + "T00:00:00");
      const dayKey = DAY_KEYS[d.getDay()];
      setDateWarning("This venue is closed on " + dayNames[dayKey] + ". Please pick another date.");
      setEndDate(""); setEndTime(""); return;
    }
    setDateWarning(""); setEndDate(val);
  };
  const clampTime = (timeVal, dateStr) => {
    const hrs = getHoursForDate(dateStr);
    if (!hrs || hrs === "closed") return timeVal;
    if (timeVal < hrs.open) return hrs.open;
    if (timeVal > hrs.close) return hrs.close;
    return timeVal;
  };

  // Recommendation — uses venueCapacity + suitableEventTypes
  const getRec = () => {
    let eventType = "", attendeeCount = 0;
    allSteps.forEach(s => {
      if (s.stepType === "venue") return;
      (s.fields || []).forEach(f => {
        const val = answers[f.id]; if (!val) return;
        const lab = (f.label || "").toLowerCase();
        if (lab.includes("event type")) eventType = String(val);
        if (lab.includes("attendee") || lab.includes("number of guest")) attendeeCount = parseInt(val, 10) || 0;
      });
    });
    if (!attendeeCount && !eventType) return null;
    const scored = venues.map(v => {
      const cap = v.venueCapacity || 0;
      const types = v.suitableEventTypes || [];
      let score = 0;
      if (!attendeeCount || cap >= attendeeCount) score += 10;
      if (!eventType || types.length === 0 || types.includes(eventType)) score += 10;
      if ((!attendeeCount || cap >= attendeeCount) && cap > 0) score += (1000 - cap) / 1000;
      return { venue: v, score };
    });
    scored.sort((a, b) => b.score - a.score);
    const best = scored[0];
    if (!best || best.score === 0) return null;
    const parts = [];
    if (eventType) parts.push("your " + eventType);
    if (attendeeCount) parts.push(attendeeCount + " attendees");
    return { venue: best.venue, reason: parts.length > 0 ? "Based on " + parts.join(" with ") + ", we recommend:" : "We recommend:" };
  };
  const rec = getRec();

  // Price calculator — auto-select cheapest plan
  const calcPrice = () => {
    if (!selected || !startDate || !startTime || !endDate || !endTime) return null;
    const start = new Date(startDate + "T" + startTime);
    const end = new Date(endDate + "T" + endTime);
    if (isNaN(start) || isNaN(end) || end <= start) return null;
    const totalHours = Math.ceil((end - start) / (1000 * 60 * 60) * 10) / 10;
    let bestPlan = null, bestTotal = Infinity;
    selected.pricing.forEach(p => {
      let base = p.basePrice, extra = 0;
      if (p.rateType !== "flat") { extra = Math.max(0, totalHours - (p.includedHours || 0)) * (p.extraHourRate || 0); }
      const t = base + extra;
      if (t < bestTotal) { bestTotal = t; bestPlan = p; }
    });
    const plan = bestPlan || selected.pricing[0];
    if (!plan) return null;
    let venueBase = plan.basePrice;
    let extraHours = plan.rateType === "flat" ? 0 : Math.max(0, totalHours - (plan.includedHours || 0));
    let extraCost = extraHours * (plan.extraHourRate || 0);
    const adv = selected.advancedPricing || {};
    let subCost = 0, subName = "";
    if (subSpaceId && selected.subSpace?.enabled) {
      const opt = (selected.subSpace.options || []).find(o => o.id === subSpaceId);
      if (opt) { subCost = opt.price || 0; subName = opt.name; }
    }
    const subtotal = venueBase + extraCost + (adv.setupFee || 0) + (adv.cleanupFee || 0) + subCost;
    return { plan, totalHours, venueBase, extraHours, extraCost, setup: adv.setupFee || 0, cleanup: adv.cleanupFee || 0, deposit: adv.securityDeposit || 0, subCost, subName, total: subtotal + (adv.securityDeposit || 0) };
  };
  const price = calcPrice();

  return (
    <div>
      {/* Gallery modal (venue or sub-space) */}
      {showGallery && selected && (() => {
        let imgs = [];
        if (showGallery === true) { imgs = selected.gallery || []; }
        else if (typeof showGallery === "string" && showGallery.startsWith("sub_")) {
          const subId = showGallery.replace("sub_", "");
          const opt = (selected.subSpace?.options || []).find(o => o.id === subId);
          imgs = opt?.gallery || [];
        }
        if (imgs.length === 0) return null;
        return (
          <div style={{position:"fixed",inset:0,zIndex:9999,background:"rgba(0,0,0,.85)",display:"flex",alignItems:"center",justifyContent:"center"}} onClick={() => setShowGallery(false)}>
            <div style={{position:"relative",maxWidth:720,width:"90%",background:"#000",borderRadius:12,overflow:"hidden"}} onClick={e => e.stopPropagation()}>
              <img src={imgs[galleryIdx]} alt={"Gallery " + (galleryIdx + 1)} style={{width:"100%",maxHeight:"70vh",objectFit:"contain",display:"block"}} />
              <div style={{position:"absolute",top:12,right:12,width:32,height:32,borderRadius:"50%",background:"rgba(255,255,255,.2)",display:"grid",placeItems:"center",cursor:"pointer",color:"#fff",fontSize:18}} onClick={() => setShowGallery(false)}>✕</div>
              {imgs.length > 1 && (
                <>
                  <div style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,.2)",display:"grid",placeItems:"center",cursor:"pointer",color:"#fff",fontSize:18}} onClick={() => setGalleryIdx((galleryIdx - 1 + imgs.length) % imgs.length)}>‹</div>
                  <div style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,.2)",display:"grid",placeItems:"center",cursor:"pointer",color:"#fff",fontSize:18}} onClick={() => setGalleryIdx((galleryIdx + 1) % imgs.length)}>›</div>
                </>
              )}
              <div style={{textAlign:"center",padding:"10px 0",color:"#fff",fontSize:12}}>{galleryIdx + 1} / {imgs.length}</div>
            </div>
          </div>
        );
      })()}

      {rec && (
        <div className="venue-rec" style={{cursor:"pointer"}} onClick={() => { setSelectedId(rec.venue.id); setSubSpaceId(null); setSubSpaceOpen(false); }}>
          <span className="ic">✦</span>
          <div><span style={{fontSize:11,color:"var(--ink-4)"}}>{rec.reason}</span><br/><strong>{rec.venue.name}</strong></div>
          <span style={{marginLeft:"auto",fontSize:12,color:"var(--accent)",fontWeight:600}}>Select →</span>
        </div>
      )}
      <div className="venue-grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))"}}>
        {venues.map(v => (
          <div key={v.id} className={"venue-thumb" + (selectedId === v.id ? " sel" : "")} onClick={() => { setSelectedId(v.id); setSubSpaceId(null); setSubSpaceOpen(false); }}>
            <div className="ph">{v.thumbnail ? <img src={v.thumbnail} alt={v.name} style={{width:"100%",height:"100%",objectFit:"cover"}} /> : v.name}</div>
            <div className="name">{v.name}</div>
          </div>
        ))}
      </div>
      {selected && (
        <div className="venue-detail">
          <div className="venue-detail-header" style={{padding:"16px 16px 0 16px"}}>
            <div className="venue-detail-img" style={{borderRadius:8,overflow:"hidden"}}>
              {selected.thumbnail ? <img src={selected.thumbnail} alt={selected.name} style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:8}} /> : selected.name + " — Photo"}
            </div>
            <div className="venue-detail-info">
              <h3>{selected.name}</h3>
              <p>{selected.description}</p>
              {(selected.gallery || []).length > 0 && (
                <div style={{marginTop:8,display:"inline-flex",alignItems:"center",gap:6,fontSize:12.5,color:"var(--accent)",fontWeight:600,cursor:"pointer"}} onClick={() => { setGalleryIdx(0); setShowGallery(true); }}>
                  📷 View gallery ({selected.gallery.length} photos)
                </div>
              )}
              {selected.equippedWith && (
                <div style={{marginTop:8}}>
                  <h5 style={{fontSize:11,fontWeight:700,margin:"0 0 4px",textTransform:"uppercase"}}>Equipped With</h5>
                  <div style={{fontSize:12,color:"var(--ink-3)",lineHeight:1.6}}>{selected.equippedWith.split("\n").filter(Boolean).map((item,i) => <div key={i}>• {item.trim()}</div>)}</div>
                </div>
              )}
            </div>
          </div>
          {selected.maxCapacity && (
            <div style={{padding:"12px 16px 16px",fontSize:12}}>
              <h5 style={{fontSize:11,fontWeight:700,margin:"0 0 4px",textTransform:"uppercase"}}>Max Capacity</h5>
              <div style={{color:"var(--ink-3)",lineHeight:1.6}}>{selected.maxCapacity.split("\n").filter(Boolean).map((item,i) => <div key={i}>• {item.trim()}</div>)}</div>
            </div>
          )}

          {/* Sub-space — checkbox + accordion */}
          {selected.subSpace?.enabled && (selected.subSpace.options || []).length > 0 && (
            <div style={{padding:"0 16px 16px"}}>
              <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,fontWeight:600}}>
                <input type="checkbox" checked={subSpaceOpen} onChange={e => { setSubSpaceOpen(e.target.checked); if (!e.target.checked) setSubSpaceId(null); }} style={{width:16,height:16,accentColor:"var(--accent)"}} />
                {selected.subSpace.title || "Add Optional Sub-Space"}
              </label>
              {selected.subSpace.description && <p style={{fontSize:12,color:"var(--ink-3)",margin:"4px 0 0",paddingLeft:24}}>{selected.subSpace.description}</p>}
              {subSpaceOpen && (
                <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:10}}>
                  {selected.subSpace.options.map(opt => (
                    <div key={opt.id} className={"venue-thumb" + (subSpaceId === opt.id ? " sel" : "")} style={{aspectRatio:"auto",padding:10,fontSize:12,display:"flex",gap:10,alignItems:"flex-start"}} onClick={() => setSubSpaceId(opt.id)}>
                      {opt.thumbnail && <img src={opt.thumbnail} alt={opt.name} style={{width:70,height:52,objectFit:"cover",borderRadius:6,flexShrink:0}} />}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
                          <strong>{opt.name}</strong>
                          <span style={{color:"var(--accent)",fontWeight:700,flexShrink:0}}>{fmt(opt.price)}</span>
                        </div>
                        {opt.description && <div style={{fontSize:11,color:"var(--ink-4)",marginTop:2}}>{opt.description.split("\n")[0]}</div>}
                        {(opt.gallery || []).length > 0 && (
                          <div style={{marginTop:3,fontSize:11,color:"var(--accent)",fontWeight:600,cursor:"pointer"}} onClick={e => { e.stopPropagation(); setGalleryIdx(0); setShowGallery("sub_" + opt.id); }}>
                            📷 {opt.gallery.length} photo{opt.gallery.length !== 1 ? "s" : ""}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Booking date/time with hours enforcement */}
          {(() => {
            const startHours = getHoursForDate(startDate);
            const endHours = getHoursForDate(endDate);

            return (
              <div style={{padding:"0 16px 16px"}}>
                <h5 style={{fontSize:12,fontWeight:700,margin:"0 0 8px"}}>Booking Date & Time</h5>
                {closedDaysList.length > 0 && (
                  <div style={{fontSize:11,color:"var(--ink-3)",marginBottom:10,background:"var(--bg-2)",padding:"8px 10px",borderRadius:6,lineHeight:1.5}}>
                    <strong>Note:</strong> This venue is closed on {closedDaysList.map(k => dayNames[k]).join(", ")}.
                  </div>
                )}
                {dateWarning && (
                  <div style={{fontSize:12,color:"#d44",background:"#fff0f0",border:"1px solid #fcc",padding:"8px 12px",borderRadius:6,marginBottom:10}}>
                    ⚠ {dateWarning}
                  </div>
                )}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <div>
                    <label style={{fontSize:11,color:"var(--ink-4)"}}>Start Date</label>
                    <input className="field-input" type="date" value={startDate} onChange={e => handleStartDate(e.target.value)} />
                  </div>
                  <div>
                    <label style={{fontSize:11,color:"var(--ink-4)"}}>Start Time{startHours && startHours !== "closed" ? ` (${startHours.open} – ${startHours.close})` : ""}</label>
                    <input className="field-input" type="time" value={startTime} min={startHours && startHours !== "closed" ? startHours.open : undefined} max={startHours && startHours !== "closed" ? startHours.close : undefined} onChange={e => setStartTime(clampTime(e.target.value, startDate))} disabled={!startDate} />
                  </div>
                  <div>
                    <label style={{fontSize:11,color:"var(--ink-4)"}}>End Date</label>
                    <input className="field-input" type="date" value={endDate} min={startDate || undefined} onChange={e => handleEndDate(e.target.value)} />
                  </div>
                  <div>
                    <label style={{fontSize:11,color:"var(--ink-4)"}}>End Time{endHours && endHours !== "closed" ? ` (${endHours.open} – ${endHours.close})` : ""}</label>
                    <input className="field-input" type="time" value={endTime} min={endHours && endHours !== "closed" ? endHours.open : undefined} max={endHours && endHours !== "closed" ? endHours.close : undefined} onChange={e => setEndTime(clampTime(e.target.value, endDate))} disabled={!endDate} />
                  </div>
                </div>
                {price && (
                  <div style={{marginTop:14,padding:14,background:"var(--bg-2)",borderRadius:10,border:"1px solid var(--line)",fontSize:13}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span>{selected.name} — {price.plan.rateType === "per_hour" ? "Per Hour" : price.plan.rateType === "per_day" ? "Per Day" : "Flat"}</span><span>{fmt(price.venueBase)}</span></div>
                    <div style={{fontSize:11,color:"var(--ink-4)",marginBottom:4}}>{price.plan.includedHours > 0 && ("Includes " + price.plan.includedHours + " hours · ")}Duration: {price.totalHours} hrs</div>
                    {price.extraHours > 0 && <div style={{display:"flex",justifyContent:"space-between"}}><span>Extra hours ({price.extraHours} × {fmt(price.plan.extraHourRate)})</span><span>{fmt(price.extraCost)}</span></div>}
                    {price.subCost > 0 && <div style={{display:"flex",justifyContent:"space-between"}}><span>{price.subName}</span><span>{fmt(price.subCost)}</span></div>}
                    {price.setup > 0 && <div style={{display:"flex",justifyContent:"space-between"}}><span>Set up fee</span><span>{fmt(price.setup)}</span></div>}
                    {price.cleanup > 0 && <div style={{display:"flex",justifyContent:"space-between"}}><span>Clean up fee</span><span>{fmt(price.cleanup)}</span></div>}
                    {price.deposit > 0 && <div style={{display:"flex",justifyContent:"space-between"}}><span>Security deposit</span><span>{fmt(price.deposit)}</span></div>}
                    <div style={{display:"flex",justifyContent:"space-between",borderTop:"1px solid var(--line)",marginTop:8,paddingTop:8,fontWeight:700,fontSize:15}}><span>Estimated Total</span><span>{fmt(price.total)}</span></div>
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

// ----- Layout Preview Body (for stepType === "layout") -----
function DynLayoutBody({ step, allSteps, answers }) {
  const spaceReqs = step.spaceRequirements || [];
  const floorLayouts = step.floorLayouts || {};
  const [selectedSpaceReqs, setSelectedSpaceReqs] = React.useState([]);
  const [selectedLayouts, setSelectedLayouts] = React.useState({});
  const [floorPlanNotes, setFloorPlanNotes] = React.useState("");

  const venueStep = allSteps.find(s => s.stepType === "venue");
  const allVenues = venueStep ? (venueStep.venues || []).filter(v => v.active && v.visibility !== "admin_only") : [];
  const selectedVenueId = answers._selectedVenueId || null;

  // Get guest count from step 2
  let guestCount = 0;
  allSteps.forEach(s => {
    if (s.stepType === "venue" || s.stepType === "layout") return;
    (s.fields || []).forEach(f => {
      const lab = (f.label || "").toLowerCase();
      if ((lab.includes("attendee") || lab.includes("number of guest") || lab.includes("number of attendees")) && answers[f.id]) {
        guestCount = parseInt(answers[f.id], 10) || 0;
      }
    });
  });

  const venueAreas = [];
  allVenues.forEach(v => {
    if (selectedVenueId && v.id !== selectedVenueId) return;
    if (floorLayouts[v.id] && (floorLayouts[v.id].layouts || []).length > 0) {
      const layouts = floorLayouts[v.id].layouts.filter(l => {
        if (!guestCount || (!l.capacityMin && !l.capacityMax)) return true;
        return guestCount >= (l.capacityMin || 0) && guestCount <= (l.capacityMax || Infinity);
      });
      if (layouts.length > 0) venueAreas.push({ id: v.id, name: v.name, layouts, blankFloorPlan: floorLayouts[v.id].blankFloorPlan || "" });
    }
    if (v.subSpace?.enabled) {
      (v.subSpace.options || []).forEach(sub => {
        if (floorLayouts[sub.id] && (floorLayouts[sub.id].layouts || []).length > 0) {
          const layouts = floorLayouts[sub.id].layouts.filter(l => {
            if (!guestCount || (!l.capacityMin && !l.capacityMax)) return true;
            return guestCount >= (l.capacityMin || 0) && guestCount <= (l.capacityMax || Infinity);
          });
          if (layouts.length > 0) venueAreas.push({ id: sub.id, name: sub.name + " (sub-space of " + v.name + ")", layouts, blankFloorPlan: floorLayouts[sub.id].blankFloorPlan || "" });
        }
      });
    }
  });

  const toggleSpaceReq = (srId) => {
    setSelectedSpaceReqs(prev => prev.includes(srId) ? prev.filter(x => x !== srId) : [...prev, srId]);
  };

  const selectLayout = (venueId, layoutId) => {
    setSelectedLayouts(prev => ({ ...prev, [venueId]: layoutId }));
  };

  return (
    <div>
      {/* Space Requirements */}
      <div style={{marginBottom:28}}>
        <h4 style={{fontSize:14,fontWeight:700,marginBottom:4}}>Space Requirements</h4>
        <p style={{fontSize:12,color:"var(--ink-3)",marginBottom:10,lineHeight:1.5}}>Select the spaces you need for your event.</p>
        <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:4}}>
          {spaceReqs.filter(sr => sr.active && sr.name).map(sr => (
            <label key={sr.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,cursor:"pointer",padding:"5px 0"}}>
              <input type="checkbox" checked={selectedSpaceReqs.includes(sr.id)} onChange={() => toggleSpaceReq(sr.id)} style={{accentColor:"var(--accent)",width:15,height:15,flexShrink:0}} />
              <span style={{fontSize:15}}>{sr.icon}</span>
              <span>{sr.name}</span>
            </label>
          ))}
        </div>
      </div>

      {/* Floor Layouts per venue area */}
      {venueAreas.map(area => {
        const chosenId = selectedLayouts[area.id] || null;
        const chosenLayout = area.layouts.find(l => l.id === chosenId) || null;

        return (
          <div key={area.id} style={{marginBottom:32,borderTop:"2px solid var(--line)",paddingTop:20}}>
            <h4 style={{fontSize:14,fontWeight:700,marginBottom:12}}>{area.name} Floor Layout:</h4>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,alignItems:"start"}}>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {area.layouts.map(layout => (
                  <label key={layout.id} style={{display:"flex",alignItems:"flex-start",gap:8,fontSize:13,cursor:"pointer",padding:"6px 0"}}>
                    <input type="radio" name={"layout_" + area.id} checked={chosenId === layout.id} onChange={() => selectLayout(area.id, layout.id)} style={{accentColor:"var(--accent)",marginTop:2}} />
                    <span>{layout.name}</span>
                  </label>
                ))}
                <label style={{display:"flex",alignItems:"flex-start",gap:8,fontSize:13,cursor:"pointer",padding:"6px 0"}}>
                  <input type="radio" name={"layout_" + area.id} checked={chosenId === "_other_" + area.id} onChange={() => selectLayout(area.id, "_other_" + area.id)} style={{accentColor:"var(--accent)",marginTop:2}} />
                  <span>Others (please write in Floor Layout field below)</span>
                </label>
              </div>

              <div style={{minHeight:180,background:"var(--bg-2)",borderRadius:8,border:"1px solid var(--line)",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>
                {chosenLayout && chosenLayout.image ? (
                  <img src={chosenLayout.image} alt={chosenLayout.name} style={{width:"100%",height:"100%",objectFit:"contain"}} />
                ) : (
                  <span style={{fontSize:12,color:"var(--ink-4)",textAlign:"center",padding:20}}>
                    {chosenLayout ? "No image available for this layout" : "Select a layout to see the floor plan"}
                  </span>
                )}
              </div>
            </div>

            {chosenLayout && (
              <div style={{marginTop:12,padding:"10px 14px",background:"var(--accent-soft)",border:"1px solid var(--accent-line)",borderRadius:8}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                  <span style={{color:"var(--accent)",fontSize:14}}>📍</span>
                  <strong style={{fontSize:13}}>Recommended for: {chosenLayout.recommendedFor || "—"} people</strong>
                  <span style={{width:14,height:14,borderRadius:"50%",background:"var(--ink)",color:"#fff",display:"inline-grid",placeItems:"center",fontSize:9,cursor:"help"}} title="This is a suggested layout and may/may not include all the space requirements you have selected.">●</span>
                </div>
                {chosenLayout.recommendedDescription && (
                  <div style={{fontSize:12,color:"var(--ink-2)",lineHeight:1.6,paddingLeft:22}}>
                    {chosenLayout.recommendedDescription.split("\n").map((line, i) => <div key={i}>{line}</div>)}
                  </div>
                )}
                <div style={{fontSize:11,color:"var(--ink-4)",marginTop:6,fontStyle:"italic"}}>
                  This is a suggested layout and may/may not include all the space requirements you have selected.
                </div>
              </div>
            )}
          </div>
        );
      })}

      {/* Floor Layout Plan (blank upload + notes) */}
      <div style={{marginBottom:24,borderTop:"2px solid var(--line)",paddingTop:20}}>
        <h4 style={{fontSize:14,fontWeight:700,marginBottom:4}}>Floor Layout Plan:</h4>
        <p style={{fontSize:12,color:"var(--ink-3)",marginBottom:12,lineHeight:1.5}}>
          Upload a floor layout you have in mind. Use one of our blank copies to help with sizes and proportions.
          {venueAreas.some(a => a.blankFloorPlan) && " "}
          {venueAreas.filter(a => a.blankFloorPlan).map((a, i) => (
            <span key={a.id}>
              {i > 0 && " | "}
              <a href={a.blankFloorPlan} download={a.name.replace(/\s+/g, "_") + "_blank_layout.png"} style={{color:"var(--accent)",cursor:"pointer",textDecoration:"underline"}}>
                Download {a.name} blank
              </a>
            </span>
          ))}
        </p>
        <div style={{marginBottom:10}}>
          <input type="file" accept="image/*,.pdf" style={{fontSize:12}} />
        </div>
        <textarea className="field-input" rows={4} value={floorPlanNotes} onChange={e => setFloorPlanNotes(e.target.value)} placeholder="Please describe your desired floor plan, seating arrangement, or setup notes." style={{width:"100%",fontSize:13,lineHeight:1.5}} />
      </div>
    </div>
  );
}

function DynamicApp() {
  const adminSteps = React.useMemo(() => loadAdminSteps(), []);
  const steps = adminSteps.filter(s =>
    s.stepType === "venue"
      ? (s.venues || []).some(v => v.active && v.visibility !== "admin_only")
      : s.stepType === "layout"
      ? true
      : s.fields.length > 0 && s.fields.some(f => f.visibleToClient !== false)
  );
  const [stepIdx, setStepIdx] = React.useState(0);
  const [answers, setAnswers] = React.useState({});

  const step = steps[stepIdx];
  const isLast = stepIdx === steps.length - 1;

  const setAnswer = (fid, val) => setAnswers(a => ({ ...a, [fid]: val }));

  const visibleFields = step ? (step.fields || []).filter(f => {
    if (f.visibleToClient === false) return false;
    if (!f.visibility) return true;
    const allFields = steps.flatMap(s => s.fields || []);
    const r = f.visibility;
    const ref = r.fieldId ? allFields.find(x => x.id === r.fieldId) : allFields.find(x => x.label === r.field);
    if (!ref) return true;
    let v = answers[ref.id];
    // Handle rich value objects (4-level tree). Backward-compat: old shape was { main, subs }.
    if (v && typeof v === "object") {
      if (v.main !== undefined) v = v.main;
      else v = Object.keys(v).join(" "); // new shape: keys are selected option labels
    }
    switch (r.op) {
      case "has_value": return v != null && v !== "" && v !== false;
      case "is_empty":  return v == null || v === "" || v === false;
      case "equals":    return String(v) === String(r.value);
      case "not_equals":return String(v) !== String(r.value);
      case "contains":  return String(v || "").toLowerCase().includes(String(r.value || "").toLowerCase());
      case "is_true":   return !!v;
      case "is_false":  return !v;
      default: return true;
    }
  }) : [];

  const guestCount = findGuestCount(steps, answers);
  const goTo = (i) => { setStepIdx(i); window.scrollTo(0,0); };

  return (
    <div className="page">
      <div className="page-header">
        <h1>Customize Your Event</h1>
        <div className="progress-bar">
          {steps.map((s,i) => (
            <React.Fragment key={s.id}>
              {i > 0 && <div className={"progress-line" + (i <= stepIdx ? " done" : "")} />}
              <div className="progress-step" onClick={() => goTo(i)}>
                <div className={"progress-dot" + (i === stepIdx ? " active" : i < stepIdx ? " done" : "")}>
                  {i < stepIdx ? "✓" : i + 1}
                </div>
                <span className={"progress-label" + (i === stepIdx ? " active" : i < stepIdx ? " done" : "")}>{s.name}</span>
              </div>
            </React.Fragment>
          ))}
        </div>
      </div>
      <div className="page-divider" />

      <div className="body-wrap">
        <div className="body-main">
          {step && (
            <>
              <div className="step-title">{step.name}</div>
              {step.description && <p className="section-note">{step.description}</p>}
              {step.stepType === "venue" ? (
                <>
                  <DynVenueBody step={step} answers={answers} allSteps={steps} onAnswer={setAnswer} />
                  {visibleFields.length > 0 && visibleFields.map(f => (
                    <DynField key={f.id} f={f} value={answers[f.id]} onChange={v => setAnswer(f.id, v)} stepType={step.stepType} guestCount={guestCount} />
                  ))}
                </>
              ) : step.stepType === "layout" ? (
                <>
                  <DynLayoutBody step={step} allSteps={steps} answers={answers} />
                  {visibleFields.length > 0 && visibleFields.map(f => (
                    <DynField key={f.id} f={f} value={answers[f.id]} onChange={v => setAnswer(f.id, v)} stepType={step.stepType} guestCount={guestCount} />
                  ))}
                </>
              ) : (
                visibleFields.map(f => (
                  <DynField key={f.id} f={f} value={answers[f.id]} onChange={v => setAnswer(f.id, v)} stepType={step.stepType} guestCount={guestCount} />
                ))
              )}
              <div className="step-nav">
                {stepIdx > 0 && <button className="btn-prev" onClick={() => goTo(stepIdx - 1)}>Previous</button>}
                <button className="btn-next" onClick={() => {
                  if (isLast) alert("✓ Booking request submitted!");
                  else goTo(stepIdx + 1);
                }}>{isLast ? "Submit" : "Next"}</button>
              </div>
            </>
          )}
        </div>
        <div className="body-sidebar">
          <DynCostSidebar steps={steps} answers={answers} />
        </div>
      </div>
    </div>
  );
}

// Decide which app to render: if admin data exists, use dynamic; otherwise use hardcoded
const adminData = loadAdminSteps();
const RootApp = adminData ? DynamicApp : App;
ReactDOM.createRoot(document.getElementById("root")).render(<RootApp/>);
</script>
</body>
</html>
