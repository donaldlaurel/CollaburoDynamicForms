<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Collaburo · Customize Your Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
/* ====== TOKENS ====== */
:root {
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --accent: #ed7a3c;
  --accent-dark: #d96a2c;
  --accent-soft: #fff4eb;
  --accent-line: #ffd9b8;
  --ink: #1a1a1a;
  --ink-2: #3a3a3a;
  --ink-3: #6b6b6b;
  --ink-4: #999;
  --line: #e5e5e5;
  --line-strong: #d0d0d0;
  --bg: #fff;
  --bg-2: #f7f7f7;
  --bg-3: #efefef;
  --danger: #d44;
  --r: 6px;
  --r-lg: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --shadow-lg: 0 4px 20px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);font-size:14px;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}

/* ====== PAGE LAYOUT ====== */
.page{min-height:100vh;display:flex;flex-direction:column}
.page-header{text-align:center;padding:36px 24px 0}
.page-header h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:28px}

/* ====== STEP PROGRESS BAR ====== */
.progress-bar{display:flex;align-items:center;justify-content:center;gap:0;padding:0 40px;margin-bottom:8px;flex-wrap:wrap}
.progress-step{display:flex;align-items:center;gap:0;cursor:pointer;white-space:nowrap}
.progress-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--ink-4);flex-shrink:0;transition:background .2s}
.progress-dot.active,.progress-dot.done{background:var(--accent)}
.progress-label{font-size:12.5px;font-weight:500;color:var(--ink-3);margin-left:8px;transition:color .2s}
.progress-label.active{color:var(--ink);font-weight:600}
.progress-label.done{color:var(--ink-2)}
.progress-line{width:40px;height:2px;background:var(--line);margin:0 6px;flex-shrink:0}
.progress-line.done{background:var(--accent)}

/* ====== DIVIDER ====== */
.page-divider{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-dark));margin:20px 0 0}

/* ====== BODY LAYOUT ====== */
.body-wrap{display:grid;grid-template-columns:1fr 340px;gap:0;flex:1;max-width:1400px;width:100%;margin:0 auto;padding:40px 48px 80px}
.body-main{padding-right:40px}
.body-sidebar{position:sticky;top:40px;align-self:start}

/* ====== COST SIDEBAR ====== */
.cost-card{border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;background:var(--bg)}
.cost-card h3{font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--line)}
.cost-label{font-size:13px;font-weight:600;margin-bottom:10px}
.cost-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--ink-2)}
.cost-row.indent{padding-left:12px}
.cost-row.indent::before{content:"•";margin-right:8px;color:var(--ink-4)}
.cost-sep{height:1px;background:var(--line);margin:10px 0}
.cost-total{display:flex;justify-content:space-between;background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:10px 14px;border-radius:var(--r);margin:12px -4px}
.cost-row b{font-weight:600}

/* ====== STEP CONTENT ====== */
.step-title{font-size:20px;font-weight:700;margin-bottom:24px}

/* ====== FORM FIELDS ====== */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-row.full{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:0}
.form-group.mb{margin-bottom:16px}
.form-group label{font-size:13px;font-weight:600}
.form-group label .req{color:var(--accent)}
.form-input{width:100%;border:1px solid var(--line-strong);border-radius:var(--r);padding:10px 12px;font-size:14px;background:var(--bg);transition:border-color .15s}
.form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(237,122,60,.12)}
.form-input::placeholder{color:var(--ink-4)}
select.form-input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23999' stroke-width='1.5' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;cursor:pointer}
textarea.form-input{min-height:80px;resize:vertical}

/* ====== CHECKBOX / RADIO ====== */
.chk-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;margin-bottom:8px;cursor:pointer}
.chk-row input[type=checkbox],.chk-row input[type=radio]{margin-top:2px;accent-color:var(--accent);flex-shrink:0}
.chk-label b{font-weight:600}
.chk-desc{color:var(--ink-3);font-size:12.5px;margin-top:1px}

/* ====== RADIO GROUP ====== */
.radio-group{margin-bottom:16px}
.radio-group-label{font-size:13px;font-weight:600;margin-bottom:8px}
.radio-option{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:13px;cursor:pointer}
.radio-option input{margin-top:3px;accent-color:var(--accent)}

/* ====== NAV BUTTONS ====== */
.step-nav{display:flex;gap:12px;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.btn-prev{border:1px solid var(--accent);color:var(--accent);background:transparent;padding:10px 28px;border-radius:var(--r);font-weight:600;font-size:14px;transition:background .15s}
.btn-prev:hover{background:var(--accent-soft)}
.btn-prev:disabled{opacity:.3;cursor:not-allowed}
.btn-next{background:var(--accent);color:#fff;padding:10px 28px;border-radius:var(--r);font-weight:600;font-size:14px;transition:background .15s}
.btn-next:hover{background:var(--accent-dark)}

/* ====== VENUE CARDS ====== */
.venue-rec{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.venue-rec .ic{font-size:16px}

.venue-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.venue-thumb{aspect-ratio:1.2;border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;border:2px solid transparent;transition:border-color .15s}
.venue-thumb.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(237,122,60,.2)}
.venue-thumb .ph{width:100%;height:100%;background:linear-gradient(135deg,var(--bg-3),#e0d8cf);display:grid;place-items:center;color:var(--ink-4);font-size:11px;font-weight:600}
.venue-thumb .name{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600;padding:6px 8px;text-align:center}

/* ====== VENUE DETAIL ====== */
.venue-detail{margin-bottom:28px}
.venue-detail-header{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.venue-detail-img{aspect-ratio:1.5;border-radius:var(--r-lg);background:linear-gradient(135deg,#d9cfc4,#b8a998);display:grid;place-items:center;color:rgba(255,255,255,.7);font-size:13px;font-weight:600;overflow:hidden;position:relative}
.venue-detail-img::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.03) 0 1px,transparent 1px 14px)}
.venue-detail-info h3{font-size:18px;font-weight:700;margin-bottom:8px}
.venue-detail-info p{font-size:13px;color:var(--ink-3);line-height:1.55;margin-bottom:12px}

.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.feature-item{font-size:12.5px;display:flex;align-items:center;gap:6px;padding:2px 0}
.feature-item::before{content:"✓";color:var(--accent);font-weight:700;font-size:11px}

.cap-table{margin-top:16px}
.cap-table h4{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:8px}
.cap-row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--bg-3)}

/* ====== ACCORDION ====== */
.accordion{border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:20px;overflow:hidden}
.accordion-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-size:14px;font-weight:600;background:var(--bg-2)}
.accordion-head .ic{color:var(--accent);font-size:16px}
.accordion-head .arrow{margin-left:auto;font-size:12px;color:var(--ink-3);transition:transform .2s}
.accordion-head .arrow.open{transform:rotate(180deg)}
.accordion-body{padding:16px;border-top:1px solid var(--line)}

.ext-option{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.ext-option:hover{border-color:var(--ink-4)}
.ext-option.sel{border-color:var(--accent);background:var(--accent-soft)}
.ext-option h5{font-size:13px;font-weight:600;margin-bottom:2px}
.ext-option p{font-size:12px;color:var(--ink-3);line-height:1.4}

/* ====== FLOOR PLAN LAYOUT ====== */
.layout-section{margin-bottom:24px}
.layout-section h4{font-size:14px;font-weight:600;margin-bottom:12px}
.layout-option{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;font-size:13px}
.layout-option input{accent-color:var(--accent)}
.layout-img{width:100%;aspect-ratio:2;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--bg-3),#ddd);margin:16px 0;display:grid;place-items:center;color:var(--ink-4);font-size:12px;font-weight:600;border:1px solid var(--line)}
.layout-cap-box{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r);padding:10px 14px;font-size:12px;margin:12px 0;color:var(--ink-2)}

/* ====== SPACE REQ CHECKBOXES ====== */
.space-req-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}

/* ====== RENTALS ====== */
.rental-category{margin-bottom:24px}
.rental-category h4{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.rental-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rental-card{border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;cursor:pointer;transition:border-color .15s}
.rental-card:hover{border-color:var(--ink-4)}
.rental-card.sel{border-color:var(--accent);background:var(--accent-soft)}
.rental-card .thumb{height:60px;border-radius:4px;background:linear-gradient(135deg,var(--bg-3),#e0d8cf);margin-bottom:6px}
.rental-card .rname{font-size:12px;font-weight:600;margin-bottom:2px}
.rental-card .rprice{font-size:11px;color:var(--ink-3)}
.rental-qty{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:6px}
.rental-qty button{width:22px;height:22px;border:1px solid var(--line-strong);border-radius:4px;display:grid;place-items:center;font-size:12px;background:var(--bg)}
.rental-qty button:hover{background:var(--bg-2)}
.rental-qty span{font-size:12px;min-width:16px;text-align:center;font-variant-numeric:tabular-nums}

/* ====== SERVICE ITEMS ====== */
.service-group{margin-bottom:20px}
.service-group h4{font-size:14px;font-weight:600;margin-bottom:10px}
.service-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg-3);font-size:13px}
.service-item:last-child{border-bottom:none}
.service-item input{margin-top:3px;accent-color:var(--accent)}
.service-info{flex:1}
.service-info b{font-weight:600;display:block;margin-bottom:2px}
.service-info span{color:var(--ink-3);font-size:12px}
.service-price{font-weight:600;color:var(--ink-2);font-size:13px;white-space:nowrap}

/* ====== CONDITIONS ====== */
.condition-box{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;background:var(--bg-2)}
.condition-box h5{font-size:13px;font-weight:600;margin-bottom:4px}
.condition-box p{font-size:12px;color:var(--ink-3);line-height:1.45;margin-bottom:8px}

/* ====== SUMMARY PAGE ====== */
.summary-card{border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 32px;max-width:640px;margin:0 auto}
.summary-card h3{font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--line)}

/* ====== MISC ====== */
.section-note{font-size:12px;color:var(--ink-3);margin-bottom:16px;line-height:1.45}
.link{color:var(--accent);text-decoration:underline;cursor:pointer;font-size:13px}
.see-all{margin-top:16px;font-size:13px}
.see-all a{color:var(--accent);text-decoration:none}
.see-all a:hover{text-decoration:underline}

/* ====== DYNAMIC FIELD TOOLTIPS ====== */
.dyn-tip-trigger:hover{background:var(--accent);color:#fff}
.dyn-tooltip{display:none;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:12px;font-weight:400;line-height:1.5;padding:12px 16px;border-radius:8px;width:280px;z-index:90;box-shadow:0 6px 24px rgba(0,0,0,.3);white-space:normal}
.dyn-tooltip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1a1a1a}
.dyn-tip-trigger:hover .dyn-tooltip{display:block}

/* ====== RESPONSIVE ====== */
@media(max-width:900px){
  .body-wrap{grid-template-columns:1fr;padding:24px}
  .body-main{padding-right:0}
  .body-sidebar{position:static;margin-top:32px}
  .venue-grid{grid-template-columns:repeat(2,1fr)}
  .progress-bar{gap:2px}
  .progress-line{width:16px}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ================================================================
   COLLABURO — Client View: "Customize Your Event"
   Hi-fi interactive prototype
   ================================================================ */

const STEPS = [
  { id:1, label:"Personal Details", short:"Personal Details" },
  { id:2, label:"Event Details", short:"Event Details" },
  { id:3, label:"Venue Space", short:"Venue Space" },
  { id:4, label:"Layout", short:"Layout" },
  { id:5, label:"Rentals", short:"Rentals" },

const VENUES = [
  { id:"main", name:"Main Hall", cap:"Up to 250 guests", img:"Main Hall", desc:"A versatile space to host your corporate meetings, conferences, dinners, special events, weddings, etc. The Main Hall is about 1500 sqft with a possibility to extend up to 1900 sqft with the Elevated Area extension.", features:["Beautiful High Cathedral Ceiling","80 Fabric Chairs","Stage with Beautiful Mirror on Stage Wall","Speakers and over-head Microphone (with stand)","Coat Racks at the entrance","Extended Elevated Area Access (by stage end of hall)","Natural Light, Decorative Lights and String Lights","A/C, Heating, and 3 adjustable ceiling fans","Buffet holders with adjustable tableberry","Butler Kitchen with adjustable tablecloths","Backstage / Priest Corner","Table Linens + Runners","Mirror + Chair of Honor","Custom signage / Chairs","MC podium / LCD projector screen + Audio","Smart TV","Whiteboard for Conferences for video calls"] },
  { id:"large", name:"Large Room", cap:"Up to 80 guests", img:"Large Room" },
  { id:"small", name:"Small Room", cap:"Up to 4 guests", img:"Small Room" },
  { id:"lounge", name:"Lounge Area", cap:"Up to 20 guests", img:"Lounge Area" },
  { id:"patio", name:"Back Patio", cap:"Up to 40 guests", img:"Back Patio" },

const EXTENSIONS = [
  { id:"full", name:"Full Area – $800", desc:"The Full Elevated Area adds about 300 sqft to the Main Hall.\n• 20 seats for formal seating\n• 50 seats for reception/cocktail-style\n• 30 seats for theater seating", price:800 },
  { id:"half", name:"Half Area – $600", desc:"The Half Elevated Area adds about 200 sqft to the Main Hall.\n• 15 seats for formal seating\n• 30 seats for reception/cocktail-style\n• 15 seats for theater seating", price:600 },
  { id:"deep", name:"Deep Half Area – $400", desc:"The Deep Half Elevated Area adds about 125 sqft to the Main Hall.\n• 10 seats for formal seating\n• 20 seats for reception/cocktail-style\n• 10 seats for theater seating", price:400 },
];

const FLOOR_LAYOUTS = [
  "8 Rectangular tables with buffet area on raised area (max 4 people)",
  "Rectangular tables with dance floor on one side (max 75 people)",
  "Rectangular tables with dance floor - two stage (max 4 people)",
  "Circular tables with buffet on raised area (max 4 people)",
  "Circular tables with buffet on raised area (max 6 people)",
  "Circular tables on raised area (max 4 people)",
  "Others: please write in Floor Layout field below",
];

const ELEVATED_LAYOUTS = [
  "Extra Seating Banquet #1","Extra Seating Banquet #2","Extra Seating Banquet #3",
  "Extra Seating Banquet #4","Extra Seating Banquet #(Y)","Extra Round Banquet #1",
  "Extra Round Banquet #2","Others: please write in Floor Layout field below",
];

const STAGE_LAYOUTS = [
  "Stage Layout #1","Stage Layout #2","Stage Layout #3",
  "Stage Layout #4","Stage Layout #5","Stage Layout #6",
  "Others: please write in Stage Layout field below",
];

const SPACE_REQS = [
  "Dance Floor Table","Dance Area","Photo Booth (photos booth can hold up to 8 people)",
  "Dessert Table","Coat Area","Clean Up Area (Event by caterers)",
];

const MAIN_HALL_RENTALS = [
  { id:"rect6", name:"Rectangular 6' Tables", price:"$12 ea", from:12 },
  { id:"rect8", name:"Rectangular 8' Tables", price:"$14 ea", from:14 },
  { id:"round", name:"Round Tables (60\")", price:"$12 ea", from:12 },
  { id:"cocktail", name:"Cocktail Tables", price:"$15 ea", from:15 },
  { id:"cushion", name:"Cushion Chairs", price:"$3 ea", from:3 },
  { id:"chiavari", name:"Chiavari Chairs", price:"$6 ea", from:6 },
];

const CONTENT_RENTALS = [
  { id:"projector", name:"Projector + Screen", price:"$80" },
  { id:"speaker", name:"Bluetooth Speakers", price:"$40" },
  { id:"mic", name:"Wireless Mic", price:"$30" },
  { id:"backdrop", name:"Photo Backdrop", price:"$90" },
  { id:"lighting", name:"Custom Uplighting", price:"$180" },
  { id:"fog", name:"Fog Machine", price:"$60" },
];

const SETUP_SERVICES = [
  { id:"basic_setup", name:"Basic Setup", desc:"Tables and chairs arranged per floor plan", price:"$67.50" },
  { id:"decor_setup", name:"Decor Setup", desc:"Linens, centerpieces, signage placement", price:"$120" },
  { id:"av_setup",    name:"AV Setup", desc:"Projector, mic, and speaker testing", price:"$45" },

const EVENT_SERVICES = [

const CLEANUP_SERVICES = [
  { id:"basic_clean", name:"Basic Cleanup", desc:"Tables cleared, floors swept", price:"$60" },
  { id:"deep_clean",  name:"Deep Cleanup", desc:"Full venue restore including kitchen", price:"$150" },

const THIRD_PARTY = [
  { id:"florist",  name:"Florist", desc:"External floral arrangements" },
  { id:"dj",       name:"DJ / Band", desc:"External entertainment" },
  { id:"photog",   name:"Photographer", desc:"External photography" },
  { id:"caterer",  name:"External Caterer", desc:"Bring your own caterer" },
];

// Catering options handled inline in Step6

const ALCOHOL_OPTIONS = [
  { id:"yes", label:"Yes", desc:"There will be alcohol/liquor/wine served at the party." },
  { id:"no",  label:"No", desc:"There will not be any alcohol/liquor/wine served at the party." },
];

const EVENT_TYPES_GROUPED = {
  "Business": ["Business / Board Meeting","Conference","Workshop / Training","Other - Business and non-alcoholic events"],
  "Social": ["Lecture / Theater / Movie","Social Event with dancing / Party","Social Event without dancing / Banquet","Reception / Cocktail Party","Wedding & Reception","Ceremony / Graduation","Memorial / End of Life Celebration","Festival / Market / Show","Other - Social and/or alcoholic events"],
};

/* ================================================================
   COST SIDEBAR
   ================================================================ */
function CostSidebar({ step }) {
  // Steps 1-2 show $0.00, steps 3+ show mock populated values
  const filled = step >= 3;
  const space = filled ? "$2,603.00" : "$0.00";
  const content = filled ? "$1,124.00" : "$0.00";
  const setup = filled ? "$67.50" : "$0.00";
  const cleanup = filled ? "$60.00" : "$0.00";
  const sub = filled ? "$3,854.50" : "$0.00";
  const tax = filled ? "$501.09" : "$0.00";
  const total = filled ? "$4,355.59" : "$0.00";

  return (
    <div className="cost-card">
      <h3>Summary of Cost</h3>
      <div className="cost-label">Total Quote:</div>
      <div className="cost-row indent"><span>Space Rental</span><span>{space}</span></div>
      <div className="cost-row indent"><span>Space Content Rentals</span><span>{content}</span></div>
      <div className="cost-row indent"><span>Catering Cost</span><span>$0.00</span></div>
      <div className="cost-row indent"><span>Set up Service Cost</span><span>{setup}</span></div>
      <div className="cost-row indent"><span>Clear up Service Cost</span><span>{cleanup}</span></div>
      <div className="cost-sep"/>
      <div className="cost-row"><span>Discount</span><span>$0.00</span></div>

// 4-level rich options tree helpers
const _RICH_HAS_CHILD = { option: "hasSubOptions", subOption: "hasSelections", selection: "hasSpecifications", specification: null };
const _RICH_CHILD     = { option: "subOptions",    subOption: "selections",    selection: "specifications",    specification: null };
const _RICH_NEXT      = { option: "subOption",     subOption: "selection",     selection: "specification",     specification: null };

// Pricing structure presets (mirrored from admin file)
const _PRICING_UNITS = {
  flat: "flat fee",
  per_person: "/ person",
  per_hour: "/ hour",
  per_person_hour: "/ person / hr",
  included: "included",
};
const _pricingUnitFor = (s) => _PRICING_UNITS[s] || "";

// Look up total guest count from workflow answers.
function findGuestCount(steps, answers) {
  for (const step of (steps || [])) {
    for (const f of (step.fields || [])) {
      const lab = (f.label || "").toLowerCase();
      if (lab.includes("attendees") || lab.includes("guests") || lab.includes("number of people")) {
        const v = answers ? answers[f.id] : null;
        const n = Number(v);
        if (v != null && v !== "" && !isNaN(n) && n > 0) return n;
      }
    }
  }
  return 0;
}

// Compute priced lines + total. Quantities live as __qty_people / __qty_hours on each value slice.
function computeRichCost(field, value, guestCount) {
  if (!field || !value || typeof value !== "object") return { total: 0, lines: [] };
  const lines = [];
  let total = 0;
  const walk = (items, valueSlice, level, depth) => {
    if (!items || !valueSlice || typeof valueSlice !== "object") return;
    const items_ = items.map(i => typeof i === "string" ? { label: i } : i);
    items_.forEach(item => {
      const childValue = valueSlice[item.label];
      if (childValue === undefined) return;
      const basePrice = item.enablePrice ? (Number(item.price) || 0) : 0;
      const guests = Number(guestCount) || 0;
      let qtyPeople = item.peopleLinkedToGuests
        ? guests
        : ((childValue && Number(childValue.__qty_people)) || 1);
      const qtyHours = (childValue && Number(childValue.__qty_hours)) || 1;
      let multiplier = 1;
      if (item.pricingStructure === "per_person") multiplier = qtyPeople;
      else if (item.pricingStructure === "per_hour") multiplier = qtyHours;
      else if (item.pricingStructure === "per_person_hour") multiplier = qtyPeople * qtyHours;
      const price = basePrice * multiplier;
      lines.push({
        label: item.label, price, basePrice, qtyPeople, qtyHours, multiplier,
        depth, enablePrice: !!item.enablePrice, pricingStructure: item.pricingStructure
      });
      total += price;
      const childKey = _RICH_CHILD[level];
      const nextLevel = _RICH_NEXT[level];
      const hasChildKey = _RICH_HAS_CHILD[level];
      if (childKey && nextLevel && hasChildKey && item[hasChildKey] && item[childKey]) {
        walk(item[childKey], childValue, nextLevel, depth + 1);
      }
    });
  };
  walk(field.options || [], value, "option", 0);
  return { total, lines };
}

// Aggregate options costs across all rich-options fields in the workflow.
function computeWorkflowOptionsCost(steps, answers) {
  const guestCount = findGuestCount(steps, answers);
  const out = [];
  (steps || []).forEach(step => {
    (step.fields || []).forEach(f => {
      if (f.visibleToClient === false) return;
      const hasRich = (f.options || []).some(o => typeof o === "object");
      if (!hasRich) return;
      const v = answers[f.id];
      if (!v || typeof v !== "object" || Object.keys(v).length === 0) return;
      const { total, lines } = computeRichCost(f, v, guestCount);
      if (lines.length === 0) return;
      out.push({ fieldId: f.id, fieldLabel: f.label, total, lines });
    });
  });
  return out;
}

// Dynamic cost sidebar for the admin-driven workflow flow.

  // Only surface priced items. Drop selected items with enablePrice off, and drop fields
  // entirely if they have no priced items selected.
  const optionsCost = computeWorkflowOptionsCost(steps, answers)
    .map((fc) => ({ ...fc, lines: fc.lines.filter((ln) => ln.enablePrice) }))
    .filter((fc) => fc.lines.length > 0);
  const optionsTotal = optionsCost.reduce((s, c) => s + c.total, 0);
  const grandTotal = optionsTotal;

  return (
    <div className="cost-card">
      <h3>Summary of Cost</h3>
      <div className="cost-label">Estimated Quote:</div>

        <div style={{fontSize:12,color:"var(--ink-4)",padding:"8px 0",fontStyle:"italic"}}>

        </div>
      )}
      {optionsCost.map(fc => (
        <div key={fc.fieldId} style={{marginBottom:8}}>
          <div className="cost-row" style={{fontWeight:600,color:"var(--ink)"}}>
            <span>{fc.fieldLabel}</span>
            <span>{fc.total > 0 ? fmt(fc.total) : ""}</span>

          {fc.lines.map((ln, i) => {
            let breakdown = "";
            if (ln.enablePrice && ln.basePrice > 0 && ln.multiplier > 1) {
              if (ln.pricingStructure === "per_person_hour") breakdown = ln.qtyPeople + " × " + ln.qtyHours + "hr × $" + ln.basePrice;
              else if (ln.pricingStructure === "per_person") breakdown = ln.qtyPeople + " × $" + ln.basePrice;
              else if (ln.pricingStructure === "per_hour") breakdown = ln.qtyHours + "hr × $" + ln.basePrice;
            }
            const priceText = ln.enablePrice && ln.price > 0 ? fmt(ln.price) : "";
            return (
              <React.Fragment key={i}>
                <div className="cost-row" style={{paddingLeft:8 + ln.depth*12,fontSize:12,color:"var(--ink-3)"}}>
                  <span>{ln.label}</span>
                  <span style={{fontSize:11}}>{priceText}</span>
                </div>
                {breakdown && (
                  <div className="cost-row" style={{paddingLeft:20 + ln.depth*12,fontSize:10,color:"var(--ink-4)",fontStyle:"italic"}}>
                    <span>{breakdown}</span>
                    <span></span>
                  </div>
                )}
              </React.Fragment>

          })}

      ))}
      {optionsCost.length > 0 && (
        <>
          <div className="cost-sep"/>
          <div className="cost-row"><b>Subtotal</b><b>{fmt(grandTotal)}</b></div>
          <div className="cost-total"><span>Total</span><span>{fmt(grandTotal)}</span></div>
        </>

function DynQuantityRow({ item, value, onChange, label, guestCount }) {
  const hasSex = !!item.hasSexOption;
  const peopleLinked = !!item.peopleLinkedToGuests;
  const hasPeopleSelector = !!item.hasPeopleOption && !peopleLinked;
  const showLinkedIndicator = !!item.hasPeopleOption && peopleLinked;
  const hasHours = !!item.hasHoursOption;
  if (!hasSex && !hasPeopleSelector && !hasHours && !showLinkedIndicator) return null;

  const cur = value[label] || {};
  const peopleRange = item.peopleRange || { min: 1, max: 50 };
  const hoursRange = item.hoursRange || { min: 1, max: 24 };
  const sexOptions = item.sexOptions || [];

  const peopleVals = Array.from({length: Math.max(0, peopleRange.max - peopleRange.min + 1)}, (_, i) => peopleRange.min + i);
  const hoursVals = Array.from({length: Math.max(0, hoursRange.max - hoursRange.min + 1)}, (_, i) => hoursRange.min + i);

  const setVal = (key, val) => onChange({ ...value, [label]: { ...cur, [key]: val } });

  const req = !!item.requireSelections;
  const reqMark = req ? <span style={{color:"#d44",fontWeight:700,marginLeft:2}}>*</span> : null;
  return (
    <div style={{display:"flex",alignItems:"center",gap:18,paddingLeft:30,marginTop:4,marginBottom:6,fontSize:13,flexWrap:"wrap"}}>
